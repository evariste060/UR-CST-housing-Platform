<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>UR-CST Student Housing</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@400;500;600;700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Foundation colours (from the brief) */
  --blue: #1D4ED8;
  --blue-700: #1E40AF;
  --blue-50: #EFF4FF;
  --blue-100: #DBE6FE;
  --ink: #0F172A;
  --night: #0F172A;
  --surface: #F8FAFC;
  --green: #16A34A;
  --green-text: #15803D;
  --green-50: #ECFDF3;
  /* Semantic, used only where needed */
  --amber-text: #92400E;
  --amber-50: #FEF6E0;
  --amber-border: #F5D48A;
  --red-text: #B91C1C;
  --red-50: #FEF2F2;
  --red-border: #F5B5B5;
  /* Neutrals with a slight blue bias */
  --white: #FFFFFF;
  --muted: #475569;
  --subtle: #64748B;
  --line: #E2E8F0;
  --line-strong: #CBD5E1;
  --slate-100: #F1F5F9;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  /* 8px spacing system */
  --s1: .5rem; --s2: 1rem; --s3: 1.5rem; --s4: 2rem; --s5: 2.5rem; --s6: 3rem; --s8: 4rem;
  --r-sm: 8px; --r: 12px; --r-lg: 16px;
  --shadow: 0 1px 2px rgba(15, 23, 42, .06), 0 1px 3px rgba(15, 23, 42, .08);
  --shadow-lg: 0 12px 32px rgba(15, 23, 42, .16);
  --focus: 0 0 0 3px #FFFFFF, 0 0 0 5px var(--blue);
  /* Layout idea: content max 1280px; student pages use a top header; landlord/admin use a left sidebar shell */
  color-scheme: light;
}
html { font-size: 100%; }
html.large-text { font-size: 112.5%; }
* { box-sizing: border-box; }
body { margin: 0; font-family: var(--font); font-size: 1rem; line-height: 1.5; color: var(--ink); background: var(--surface); -webkit-font-smoothing: antialiased; }
img { max-width: 100%; display: block; }
a { color: var(--blue); }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { text-wrap: balance; margin: 0; line-height: 1.25; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: none; box-shadow: var(--focus); border-radius: 6px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.ic { width: 1.25em; height: 1.25em; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ic.filled { fill: currentColor; }

/* Type scale */
.t-page { font-size: 2rem; font-weight: 700; letter-spacing: -.02em; }
.t-section { font-size: 1.375rem; font-weight: 700; letter-spacing: -.01em; }
.t-card { font-size: 1.0625rem; font-weight: 600; }
.t-body { font-size: 1rem; }
.t-support { font-size: .875rem; color: var(--muted); }
.t-label { font-size: .9375rem; font-weight: 600; }
.t-help { font-size: .875rem; color: var(--muted); }
.t-price { font-size: 1.375rem; font-weight: 700; letter-spacing: -.01em; }
.muted { color: var(--muted); }

/* Prototype bar */
.proto-bar { background: var(--night); color: #E2E8F0; font-size: .8125rem; }
.proto-bar .in { max-width: 1440px; margin: 0 auto; padding: 6px 16px; display: flex; align-items: center; gap: 12px; overflow-x: auto; white-space: nowrap; }
.proto-bar b { color: #fff; font-weight: 600; }
.proto-bar .sep { width: 1px; height: 18px; background: #334155; flex: none; }
.proto-bar button, .proto-bar a { background: transparent; border: 1px solid #334155; color: #E2E8F0; border-radius: 999px; padding: 4px 10px; cursor: pointer; text-decoration: none; font-size: .8125rem; min-height: 30px; display: inline-flex; align-items: center; gap: 6px; }
.proto-bar button[aria-pressed="true"] { background: #fff; color: var(--ink); border-color: #fff; font-weight: 600; }
.proto-bar button:hover, .proto-bar a:hover { border-color: #94A3B8; }

/* Header */
.header { background: var(--white); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 40; }
.header .in { max-width: 1280px; margin: 0 auto; padding: 0 24px; height: 68px; display: flex; align-items: center; gap: 24px; }
.logo { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; color: var(--ink); text-decoration: none; font-size: 1.0625rem; letter-spacing: -.01em; white-space: nowrap; }
.logo-mark { width: 36px; height: 36px; border-radius: 10px; background: var(--blue); color: #fff; display: grid; place-items: center; }
.logo small { display: block; font-weight: 500; font-size: .75rem; color: var(--muted); letter-spacing: 0; }
.nav { display: flex; align-items: center; gap: 4px; flex: 1; }
.nav a, .nav button.link { color: var(--ink); text-decoration: none; padding: 10px 12px; border-radius: 8px; font-weight: 500; font-size: .9375rem; display: inline-flex; gap: 6px; align-items: center; background: none; border: 0; cursor: pointer; min-height: 44px; }
.nav a:hover { background: var(--slate-100); }
.nav a[aria-current="page"] { color: var(--blue); background: var(--blue-50); }
.header-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.count-pill { background: var(--blue); color: #fff; border-radius: 999px; font-size: .75rem; font-weight: 700; min-width: 20px; height: 20px; padding: 0 6px; display: inline-grid; place-items: center; }
.icon-btn { position: relative; width: 44px; height: 44px; border-radius: 10px; border: 1px solid transparent; background: transparent; display: inline-grid; place-items: center; cursor: pointer; color: var(--ink); }
.icon-btn:hover { background: var(--slate-100); }
.icon-btn .dot { position: absolute; top: 6px; right: 6px; }
.menu-btn { display: none; }
.mobile-nav { display: none; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 18px; border-radius: 10px; border: 1px solid transparent; font-weight: 600; font-size: .9375rem; cursor: pointer; text-decoration: none; white-space: nowrap; transition: background .15s, border-color .15s; }
.btn-primary { background: var(--blue); color: #fff; }
.btn-primary:hover { background: var(--blue-700); }
.btn-secondary { background: var(--white); color: var(--ink); border-color: var(--line-strong); }
.btn-secondary:hover { background: var(--slate-100); }
.btn-ghost { background: transparent; color: var(--blue); }
.btn-ghost:hover { background: var(--blue-50); }
.btn-success { background: var(--green-text); color: #fff; }
.btn-success:hover { background: #166534; }
.btn-danger { background: var(--red-text); color: #fff; }
.btn-danger:hover { background: #991B1B; }
.btn-danger-outline { background: var(--white); color: var(--red-text); border-color: var(--red-border); }
.btn-danger-outline:hover { background: var(--red-50); }
.btn-sm { min-height: 36px; padding: 6px 12px; font-size: .875rem; border-radius: 8px; }
.btn-lg { min-height: 52px; padding: 12px 24px; font-size: 1rem; }
.btn-block { width: 100%; }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }
.save-btn[aria-pressed="true"] { color: var(--red-text); }
.save-btn[aria-pressed="true"] .ic { fill: currentColor; }
.link-btn { background: none; border: 0; color: var(--blue); font-weight: 600; cursor: pointer; padding: 4px 2px; text-decoration: underline; text-underline-offset: 3px; min-height: 32px; }

/* Layout */
.page { max-width: 1280px; margin: 0 auto; padding: 32px 24px 96px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
.page-head p { margin-top: 6px; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.stack-sm { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.row-between { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; }
.panel { background: var(--white); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 24px; }
.panel-tight { padding: 16px; }
.panel h2 + *, .panel h3 + * { margin-top: 12px; }
.divider { height: 1px; background: var(--line); margin: 16px 0; border: 0; }
.breadcrumb { display: flex; gap: 8px; align-items: center; font-size: .875rem; color: var(--muted); margin-bottom: 16px; flex-wrap: wrap; }
.breadcrumb a { color: var(--muted); }
.two-col > * { min-width: 0; }
.two-col { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 32px; align-items: start; }
.sticky { position: sticky; top: 92px; }

/* Badges */
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: .8125rem; font-weight: 600; padding: 4px 10px; border-radius: 999px; border: 1px solid; white-space: nowrap; line-height: 1.3; }
.badge .ic { width: 14px; height: 14px; }
.b-available { color: var(--green-text); background: var(--green-50); border-color: #A7E3BC; }
.b-occupied { color: #334155; background: var(--slate-100); border-color: var(--line-strong); }
.b-pending { color: var(--amber-text); background: var(--amber-50); border-color: var(--amber-border); }
.b-approved { color: var(--blue-700); background: var(--blue-50); border-color: var(--blue-100); }
.b-rejected, .b-removed, .b-suspended { color: var(--red-text); background: var(--red-50); border-color: var(--red-border); }
.b-changes { color: var(--amber-text); background: var(--amber-50); border-color: var(--amber-border); }
.b-neutral { color: var(--muted); background: var(--white); border-color: var(--line); }
.b-new { color: var(--blue-700); background: var(--blue-50); border-color: var(--blue-100); }
.b-demo { color: var(--muted); background: var(--slate-100); border-color: var(--line); font-weight: 500; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--blue); display: inline-block; flex: none; }

/* Property card */
.pcard { background: var(--white); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; display: flex; flex-direction: column; transition: box-shadow .15s, border-color .15s; }
.pcard:hover { box-shadow: var(--shadow-lg); border-color: var(--line-strong); }
.pcard .media { position: relative; aspect-ratio: 16 / 10; background: var(--slate-100); }
.pcard .media img { width: 100%; height: 100%; object-fit: cover; }
.pcard .media .media-link { display: block; height: 100%; }
.pcard .media .badge { position: absolute; left: 12px; top: 12px; }
.pcard .media .save-btn { position: absolute; right: 10px; top: 10px; background: rgba(255, 255, 255, .95); border: 1px solid var(--line); box-shadow: var(--shadow); }
.pcard .body { padding: 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.pcard .price-line { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.pcard .price-line span { font-size: .875rem; color: var(--muted); }
.pcard .meta { display: flex; gap: 6px; align-items: center; font-size: .9375rem; font-weight: 600; }
.pcard .meta .ic { color: var(--blue); }
.pcard .title { font-size: 1rem; font-weight: 600; color: var(--ink); text-decoration: none; }
.pcard .title:hover { text-decoration: underline; }
.pcard .sub { font-size: .875rem; color: var(--muted); }
.pcard .facs { display: flex; gap: 6px; flex-wrap: wrap; }
.pcard .actions { display: flex; gap: 8px; margin-top: auto; padding-top: 8px; }
.pcard .actions .btn { flex: 1; }
.fchip { display: inline-flex; align-items: center; gap: 4px; font-size: .8125rem; color: #334155; background: var(--slate-100); border-radius: 6px; padding: 3px 8px; }
.fchip .ic { width: 14px; height: 14px; color: var(--blue); }
.list-view .pcard { flex-direction: row; }
.list-view .pcard .media { width: 300px; aspect-ratio: auto; min-height: 200px; flex: none; }
.list-view.grid-cards { grid-template-columns: 1fr; }

/* Forms */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .field .label { font-weight: 600; font-size: .9375rem; }
.field .req { color: var(--red-text); }
.input, .select, .textarea { width: 100%; min-height: 48px; padding: 10px 14px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--white); font-size: 1rem; }
.textarea { min-height: 120px; resize: vertical; line-height: 1.5; }
.input:hover, .select:hover, .textarea:hover { border-color: #94A3B8; }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-100); }
.field.has-error .input, .field.has-error .select, .field.has-error .textarea { border-color: var(--red-text); }
.err-msg { color: var(--red-text); font-size: .875rem; display: flex; gap: 6px; align-items: flex-start; font-weight: 500; }
.err-msg .ic { width: 16px; height: 16px; margin-top: 2px; }
.input-wrap { position: relative; }
.input-wrap .input { padding-right: 52px; }
.input-wrap .icon-btn { position: absolute; right: 2px; top: 2px; }
.input-icon { position: relative; }
.input-icon > .ic { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--subtle); }
.input-icon .input, .input-icon .select { padding-left: 44px; }
.check { display: flex; gap: 10px; align-items: center; min-height: 40px; cursor: pointer; font-size: .9375rem; }
.check input { width: 20px; height: 20px; accent-color: var(--blue); flex: none; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 20px; }
.form-grid .full { grid-column: 1 / -1; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 52px; cursor: pointer; }
.switch input { appearance: none; width: 48px; height: 28px; background: var(--line-strong); border-radius: 999px; position: relative; cursor: pointer; flex: none; transition: background .15s; }
.switch input::after { content: ""; position: absolute; width: 22px; height: 22px; left: 3px; top: 3px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: var(--shadow); }
.switch input:checked { background: var(--blue); }
.switch input:checked::after { left: 23px; }
.choice-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.choice { border: 2px solid var(--line); border-radius: var(--r); padding: 16px; background: var(--white); cursor: pointer; display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%; }
.choice:hover { border-color: var(--line-strong); }
.choice[aria-pressed="true"], .choice.selected { border-color: var(--blue); background: var(--blue-50); }
.choice .ic { width: 24px; height: 24px; color: var(--blue); margin-top: 2px; }
.seg { display: inline-flex; background: var(--slate-100); border-radius: 10px; padding: 4px; gap: 4px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 8px 14px; border-radius: 8px; font-weight: 600; font-size: .875rem; cursor: pointer; min-height: 38px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.seg button[aria-pressed="true"] { background: var(--white); color: var(--ink); box-shadow: var(--shadow); }
input[type="range"] { width: 100%; accent-color: var(--blue); height: 28px; }

/* Hero */
.hero { background: linear-gradient(180deg, var(--white) 0%, var(--surface) 100%); border-bottom: 1px solid var(--line); }
.hero .in { max-width: 1280px; margin: 0 auto; padding: 64px 24px 56px; display: grid; grid-template-columns: 1.25fr .75fr; gap: 48px; align-items: center; }
.hero h1 { font-size: 3rem; font-weight: 800; letter-spacing: -.03em; line-height: 1.08; }
.hero h1 em { font-style: normal; color: var(--blue); }
.hero p.lead { font-size: 1.1875rem; color: var(--muted); margin-top: 16px; max-width: 34em; }
.hero-search { margin-top: 32px; background: var(--white); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-lg); padding: 16px; display: grid; grid-template-columns: 1.2fr 1fr 1fr auto; gap: 12px; align-items: end; }
.hero-search .field label { font-size: .8125rem; color: var(--muted); }
.hero-art { position: relative; border-radius: 20px; overflow: hidden; aspect-ratio: 400 / 260; box-shadow: var(--shadow-lg); }
.hero-art img { width: 100%; height: 100%; object-fit: cover; }
.hero-art .float { position: absolute; background: #fff; border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow-lg); display: flex; gap: 10px; align-items: center; font-size: .875rem; }
.trust { display: flex; gap: 20px; margin-top: 20px; flex-wrap: wrap; font-size: .875rem; color: var(--muted); }
.trust span { display: inline-flex; gap: 6px; align-items: center; }
.trust .ic { color: var(--green-text); }
.section { max-width: 1280px; margin: 0 auto; padding: 56px 24px; }
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; counter-reset: s; }
.step { background: var(--white); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 24px; }
.step .n { width: 40px; height: 40px; border-radius: 10px; background: var(--blue-50); color: var(--blue); font-weight: 700; display: grid; place-items: center; margin-bottom: 16px; }
.footer { background: var(--night); color: #CBD5E1; }
.footer .in { max-width: 1280px; margin: 0 auto; padding: 48px 24px 32px; display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 32px; }
.footer h4 { color: #fff; font-size: .9375rem; margin-bottom: 12px; }
.footer a, .footer button { color: #CBD5E1; text-decoration: none; display: block; padding: 4px 0; background: none; border: 0; cursor: pointer; font-size: .9375rem; text-align: left; }
.footer a:hover, .footer button:hover { color: #fff; text-decoration: underline; }
.footer .bottom { border-top: 1px solid #1E293B; max-width: 1280px; margin: 0 auto; padding: 16px 24px; font-size: .8125rem; color: #94A3B8; }

/* Search page */
.search-layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 32px; align-items: start; }
.filters { background: var(--white); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 20px; position: sticky; top: 92px; max-height: calc(100vh - 110px); overflow-y: auto; }
.filters fieldset { border: 0; padding: 0; margin: 0 0 20px; }
.filters legend { font-weight: 700; font-size: .9375rem; margin-bottom: 8px; padding: 0; }
.filters .range-out { display: flex; justify-content: space-between; font-size: .875rem; color: var(--muted); }
.filters .range-out b { color: var(--ink); }
.filter-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.filter-drawer-foot { display: none; }
.searchbar { display: flex; gap: 12px; margin-bottom: 16px; }
.searchbar .input-icon { flex: 1; }
.toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--blue-50); color: var(--blue-700); border: 1px solid var(--blue-100); border-radius: 999px; padding: 4px 6px 4px 12px; font-size: .875rem; font-weight: 600; }
.chip button { border: 0; background: transparent; color: inherit; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; }
.chip button:hover { background: var(--blue-100); }
.result-count { font-weight: 600; }
.mobile-filter-btn { display: none; }

/* Empty / state blocks */
.state { text-align: center; padding: 48px 24px; background: var(--white); border: 1px dashed var(--line-strong); border-radius: var(--r-lg); display: flex; flex-direction: column; align-items: center; gap: 12px; }
.state .state-ic { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; background: var(--blue-50); color: var(--blue); }
.state .state-ic .ic { width: 28px; height: 28px; }
.state.error .state-ic { background: var(--red-50); color: var(--red-text); }
.state.success .state-ic { background: var(--green-50); color: var(--green-text); }
.state h3 { font-size: 1.1875rem; }
.state p { color: var(--muted); max-width: 32em; }
.state .row { justify-content: center; margin-top: 8px; }
.skel { background: linear-gradient(90deg, #EEF2F6 25%, #E2E8F0 37%, #EEF2F6 63%); background-size: 400% 100%; animation: sk 1.2s ease infinite; border-radius: 8px; }
@keyframes sk { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
.spinner { width: 20px; height: 20px; border: 3px solid var(--blue-100); border-top-color: var(--blue); border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Notice / callout */
.notice { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: var(--r); border: 1px solid var(--blue-100); background: var(--blue-50); color: var(--ink); font-size: .9375rem; }
.notice > .ic { color: var(--blue); margin-top: 2px; }
.notice.warn { background: var(--amber-50); border-color: var(--amber-border); }
.notice.warn > .ic { color: var(--amber-text); }
.notice.ok { background: var(--green-50); border-color: #A7E3BC; }
.notice.ok > .ic { color: var(--green-text); }
.notice.err { background: var(--red-50); border-color: var(--red-border); }
.notice.err > .ic { color: var(--red-text); }
.tip { display: flex; gap: 10px; align-items: flex-start; font-size: .875rem; color: var(--muted); background: var(--slate-100); padding: 10px 12px; border-radius: 10px; }
.tip .ic { color: var(--blue); margin-top: 1px; }

/* Property details */
.gallery-main { position: relative; border-radius: var(--r-lg); overflow: hidden; background: var(--slate-100); aspect-ratio: 16 / 9.5; }
.gallery-main img { width: 100%; height: 100%; object-fit: cover; }
.gallery-main .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); width: 48px; height: 48px; border-radius: 50%; border: 0; background: rgba(255, 255, 255, .95); box-shadow: var(--shadow-lg); cursor: pointer; display: grid; place-items: center; }
.gallery-main .prev { left: 12px; } .gallery-main .next { right: 12px; }
.gallery-main .counter { position: absolute; left: 12px; bottom: 12px; background: rgba(15, 23, 42, .78); color: #fff; padding: 4px 10px; border-radius: 999px; font-size: .8125rem; font-weight: 600; }
.gallery-main .fs { position: absolute; right: 12px; bottom: 12px; }
.thumbs { display: flex; gap: 8px; margin-top: 8px; overflow-x: auto; padding: 4px 2px; }
.thumbs button { border: 2px solid transparent; padding: 0; border-radius: 10px; overflow: hidden; width: 104px; height: 68px; flex: none; cursor: pointer; background: none; }
.thumbs button[aria-current="true"] { border-color: var(--blue); }
.thumbs img { width: 100%; height: 100%; object-fit: cover; }
.facility-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.facility { display: flex; gap: 12px; align-items: center; padding: 12px; border: 1px solid var(--line); border-radius: var(--r); }
.facility .fi { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: var(--blue-50); color: var(--blue); flex: none; }
.facility.no .fi { background: var(--slate-100); color: var(--subtle); }
.facility .st { font-size: .8125rem; color: var(--muted); display: flex; gap: 4px; align-items: center; }
.facility .st .ic { width: 14px; height: 14px; }
.facility.yes .st { color: var(--green-text); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 10px 16px; font-size: .9375rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-weight: 600; text-align: right; }
.map { border-radius: var(--r); overflow: hidden; border: 1px solid var(--line); background: #EEF3EE; }
.map svg { display: block; width: 100%; height: auto; }
.landmarks { display: grid; gap: 8px; margin-top: 12px; }
.landmarks li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: .9375rem; }
.landmarks { list-style: none; padding: 0; }
.sticky-contact { display: none; }
.desc.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.avatar { width: 48px; height: 48px; border-radius: 50%; background: var(--blue-100); color: var(--blue-700); display: grid; place-items: center; font-weight: 700; flex: none; }
.avatar.sm { width: 36px; height: 36px; font-size: .8125rem; }

/* Compare */
.compare-tray { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 45; background: var(--night); color: #fff; border-radius: 14px; padding: 10px 10px 10px 18px; display: flex; gap: 14px; align-items: center; box-shadow: var(--shadow-lg); max-width: calc(100% - 32px); }
.compare-tray .thumbs-mini { display: flex; gap: 6px; }
.compare-tray .thumbs-mini img { width: 40px; height: 32px; border-radius: 6px; object-fit: cover; border: 2px solid #334155; }
.compare-tray .btn-secondary { background: transparent; color: #fff; border-color: #475569; }
.compare-tray .btn-secondary:hover { background: #1E293B; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--white); }
table { border-collapse: collapse; width: 100%; font-size: .9375rem; }
th, td { text-align: left; padding: 14px 16px; border-bottom: 1px solid var(--line); vertical-align: top; }
thead th { font-size: .8125rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); background: var(--surface); font-weight: 700; }
tbody tr:last-child td, tbody tr:last-child th { border-bottom: 0; }
.cmp th[scope="row"] { position: sticky; left: 0; background: var(--white); z-index: 1; width: 170px; min-width: 150px; font-weight: 600; color: var(--muted); }
.cmp td { min-width: 210px; }
.cmp tr.diff td, .cmp tr.diff th[scope="row"] { background: #FAFCFF; }
.cmp tr.diff th[scope="row"]::after { content: "Differs"; display: block; font-size: .6875rem; font-weight: 700; color: var(--blue); text-transform: uppercase; letter-spacing: .05em; margin-top: 2px; }
.cmp .best { display: inline-flex; margin-left: 6px; }
.cmp .head-cell img { width: 100%; height: 120px; object-fit: cover; border-radius: 10px; }
.yes-txt { color: var(--green-text); font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
.no-txt { color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }

/* Shell (landlord / admin) */
.shell { display: grid; grid-template-columns: 260px minmax(0, 1fr); min-height: calc(100vh - 110px); }
.side { background: var(--white); border-right: 1px solid var(--line); padding: 20px 14px; position: sticky; top: 68px; height: calc(100vh - 68px); overflow-y: auto; }
.side .role-tag { font-size: .75rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; padding: 0 12px 8px; }
.side a { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 10px; color: var(--ink); text-decoration: none; font-weight: 500; min-height: 44px; }
.side a:hover { background: var(--slate-100); }
.side a[aria-current="page"] { background: var(--blue-50); color: var(--blue-700); font-weight: 600; }
.side a .count-pill { margin-left: auto; }
.side .side-cta { margin: 8px 0 16px; }
.shell-main { min-width: 0; }
.shell-main .page { max-width: 1160px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 16px; }
.tile { background: var(--white); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px 20px; display: flex; flex-direction: column; gap: 4px; text-decoration: none; color: var(--ink); position: relative; }
a.tile:hover { border-color: var(--blue); box-shadow: var(--shadow); }
.tile .lab { font-size: .875rem; color: var(--muted); font-weight: 500; display: flex; gap: 8px; align-items: center; }
.tile .val { font-size: 2rem; font-weight: 700; letter-spacing: -.02em; }
.tile .stripe { position: absolute; left: 0; top: 16px; bottom: 16px; width: 4px; border-radius: 0 4px 4px 0; }
.list { background: var(--white); border: 1px solid var(--line); border-radius: var(--r-lg); }
.list-item { display: flex; gap: 16px; padding: 16px 20px; border-bottom: 1px solid var(--line); align-items: center; }
.list-item:last-child { border-bottom: 0; }
.list-item .thumb { width: 96px; height: 72px; border-radius: 10px; object-fit: cover; flex: none; }
.list-item .grow { flex: 1; min-width: 0; }
.list-item .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.list-item.unread { background: #FAFCFF; }
.list-item.clickable { cursor: pointer; }
.list-item.clickable:hover { background: var(--surface); }
.status-pair { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.status-pair .k { font-size: .75rem; color: var(--muted); display: block; margin-bottom: 2px; font-weight: 600; }

/* Wizard */
.progress { display: flex; gap: 8px; list-style: none; padding: 0; margin: 0 0 24px; }
.progress li { flex: 1; }
.progress button { width: 100%; text-align: left; background: none; border: 0; padding: 0; cursor: pointer; }
.progress button[disabled] { cursor: default; }
.progress .bar { height: 6px; border-radius: 999px; background: var(--line); margin-bottom: 8px; }
.progress .done .bar, .progress .cur .bar { background: var(--blue); }
.progress .lbl { font-size: .8125rem; color: var(--muted); font-weight: 600; display: flex; gap: 6px; align-items: center; }
.progress .cur .lbl { color: var(--ink); }
.progress .done .lbl .ic { color: var(--green-text); width: 16px; height: 16px; }
.wiz-foot { display: flex; justify-content: space-between; gap: 12px; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.autosave { font-size: .8125rem; color: var(--green-text); display: inline-flex; gap: 6px; align-items: center; font-weight: 500; }
.photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
.photo { border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--white); }
.photo.cover { border: 2px solid var(--blue); }
.photo img { width: 100%; height: 120px; object-fit: cover; }
.photo .pbar { display: flex; gap: 4px; padding: 6px; justify-content: space-between; align-items: center; }
.photo .pbar .icon-btn { width: 36px; height: 36px; }
.drop { border: 2px dashed var(--line-strong); border-radius: var(--r-lg); padding: 28px; text-align: center; background: var(--surface); display: flex; flex-direction: column; gap: 10px; align-items: center; }
.pin-map { cursor: crosshair; }
.review-sec { border: 1px solid var(--line); border-radius: var(--r); padding: 16px 20px; }
.review-sec h3 { font-size: 1rem; display: flex; justify-content: space-between; align-items: center; }

/* Inquiries split */
.split { display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 0; background: var(--white); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; min-height: 480px; }
.split .left { border-right: 1px solid var(--line); }
.split .right { padding: 24px; display: flex; flex-direction: column; gap: 16px; }
.bubble { padding: 12px 14px; border-radius: 12px; max-width: 80%; font-size: .9375rem; }
.bubble.in { background: var(--slate-100); align-self: flex-start; }
.bubble.out { background: var(--blue-50); border: 1px solid var(--blue-100); align-self: flex-end; }
.bubble small { display: block; color: var(--muted); font-size: .75rem; margin-top: 4px; }
.thread { display: flex; flex-direction: column; gap: 10px; }
.list-item[aria-current="true"] { background: var(--blue-50); }

/* Modal, toast, dropdown */
.overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, .5); z-index: 80; display: grid; place-items: center; padding: 16px; }
.modal { background: var(--white); border-radius: var(--r-lg); width: min(520px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; box-shadow: var(--shadow-lg); }
.modal.wide { width: min(760px, 100%); }
.modal .mh { padding: 20px 24px 0; display: flex; gap: 12px; align-items: flex-start; }
.modal .mh h2 { font-size: 1.1875rem; flex: 1; padding-top: 8px; }
.modal .mb { padding: 12px 24px 8px; color: var(--muted); display: flex; flex-direction: column; gap: 12px; }
.modal .mb .field, .modal .mb .input, .modal .mb .textarea { color: var(--ink); }
.modal .mf { padding: 16px 24px 20px; display: flex; gap: 12px; justify-content: flex-end; flex-wrap: wrap; }
.modal .m-ic { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--blue-50); color: var(--blue); flex: none; }
.modal .m-ic.danger { background: var(--red-50); color: var(--red-text); }
.modal .m-ic.ok { background: var(--green-50); color: var(--green-text); }
.lightbox { background: #0B1120; width: min(1100px, 100%); border-radius: var(--r-lg); overflow: hidden; position: relative; }
.lightbox img { width: 100%; max-height: 80vh; object-fit: contain; }
.lightbox .bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; color: #fff; }
.lightbox .bar .icon-btn { color: #fff; }
.lightbox .bar .icon-btn:hover { background: #1E293B; }
#toasts { position: fixed; right: 16px; bottom: 16px; z-index: 90; display: flex; flex-direction: column; gap: 10px; align-items: flex-end; pointer-events: none; }
.toast { pointer-events: auto; background: var(--night); color: #fff; border-radius: 12px; padding: 12px 12px 12px 16px; display: flex; gap: 12px; align-items: center; box-shadow: var(--shadow-lg); max-width: min(440px, calc(100vw - 32px)); font-size: .9375rem; animation: tin .2s ease; }
.toast .ic { color: #86EFAC; }
.toast.error .ic { color: #FCA5A5; }
.toast.info .ic { color: #93C5FD; }
.toast button { background: transparent; border: 1px solid #475569; color: #fff; border-radius: 8px; padding: 6px 12px; cursor: pointer; font-weight: 600; min-height: 36px; }
.toast button.x { border: 0; padding: 6px; }
@keyframes tin { from { transform: translateY(8px); opacity: 0; } }
.dropdown { position: absolute; right: 0; top: calc(100% + 8px); background: var(--white); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-lg); width: 380px; z-index: 60; overflow: hidden; }
.dropdown .dh { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.rel { position: relative; }
.notif { display: flex; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); cursor: pointer; background: var(--white); border-left: 0; border-right: 0; border-top: 0; width: 100%; text-align: left; align-items: flex-start; }
.notif:hover { background: var(--surface); }
.notif.unread { background: #F5F8FF; }
.notif .ni { width: 36px; height: 36px; border-radius: 10px; background: var(--blue-50); color: var(--blue); display: grid; place-items: center; flex: none; }
.notif .when { font-size: .8125rem; color: var(--muted); }
.notif .ustate { font-size: .75rem; font-weight: 700; color: var(--blue); }

/* Docs pages */
.doc h2 { margin: 40px 0 12px; }
.doc h2:first-child { margin-top: 0; }
.doc p, .doc li { max-width: 72ch; }
.doc ul { padding-left: 20px; margin: 8px 0; }
.doc li { margin: 4px 0; }
.swatch { border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--white); }
.swatch .chip-col { height: 80px; }
.swatch .info { padding: 12px; font-size: .875rem; }
.swatch code { font-size: .8125rem; color: var(--muted); }
.ds-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
.spacing-row { display: flex; align-items: center; gap: 16px; font-size: .875rem; }
.spacing-row .bar { background: var(--blue-100); border: 1px solid var(--blue); height: 20px; }
.sitemap { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
.sitemap .panel h3 { font-size: 1rem; }
.sitemap a { display: block; padding: 4px 0; }
details.faq { border: 1px solid var(--line); border-radius: var(--r); background: var(--white); }
details.faq + details.faq { margin-top: 8px; }
details.faq summary { cursor: pointer; padding: 16px 20px; font-weight: 600; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 52px; }
details.faq summary::-webkit-details-marker { display: none; }
details.faq summary .ic { transition: transform .15s; }
details.faq[open] summary .ic { transform: rotate(180deg); }
details.faq .a { padding: 0 20px 16px; color: var(--muted); }
.mini { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.mini:last-child { border-bottom: 0; }
.mini img { width: 72px; height: 54px; border-radius: 8px; object-fit: cover; flex: none; }
.mini .grow { flex: 1; min-width: 0; }
.mini a.t { font-weight: 600; color: var(--ink); text-decoration: none; }
.mini a.t:hover { text-decoration: underline; }
.dash-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
.hcd-table td { min-width: 160px; }
.hcd-table td:first-child { font-weight: 600; min-width: 140px; }
.auth-wrap { min-height: calc(100vh - 110px); display: grid; place-items: center; padding: 32px 16px; }
.auth-card { width: min(480px, 100%); background: var(--white); border: 1px solid var(--line); border-radius: 20px; padding: 32px; box-shadow: var(--shadow); }
.auth-card.wide { width: min(640px, 100%); }
.demo-accounts { display: grid; gap: 8px; }
.demo-acc { display: flex; gap: 12px; align-items: center; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--surface); cursor: pointer; text-align: left; width: 100%; min-height: 56px; }
.demo-acc:hover { border-color: var(--blue); background: var(--blue-50); }
.demo-acc .grow { flex: 1; }
.or { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: .875rem; margin: 20px 0; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }

/* Responsive */
@media (max-width: 1100px) {
  .hero .in { grid-template-columns: 1fr; }
  .hero-art { display: none; }
  .two-col { grid-template-columns: minmax(0, 1fr); }
  .sticky { position: static; }
  .footer .in { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 900px) {
  .nav, .header-actions .hide-m { display: none; }
  .menu-btn { display: inline-grid; }
  .mobile-nav { display: block; position: fixed; inset: 0; z-index: 70; background: rgba(15, 23, 42, .5); }
  .mobile-nav[hidden] { display: none; }
  .mobile-nav .sheet { position: absolute; right: 0; top: 0; bottom: 0; width: min(340px, 88%); background: var(--white); padding: 16px; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
  .mobile-nav .sheet a, .mobile-nav .sheet button.nav-link { display: flex; align-items: center; gap: 12px; padding: 14px 12px; border-radius: 10px; color: var(--ink); text-decoration: none; font-weight: 600; min-height: 52px; background: none; border: 0; width: 100%; text-align: left; cursor: pointer; font-size: 1rem; }
  .mobile-nav .sheet a[aria-current="page"] { background: var(--blue-50); color: var(--blue-700); }
  .search-layout { grid-template-columns: minmax(0, 1fr); }
  .filters { position: fixed; inset: 0 0 0 auto; width: min(400px, 100%); max-height: none; height: 100%; z-index: 75; border-radius: 0; transform: translateX(105%); transition: transform .2s; padding-bottom: 96px; }
  .filters.open { transform: none; box-shadow: var(--shadow-lg); }
  .filter-backdrop { position: fixed; inset: 0; background: rgba(15, 23, 42, .5); z-index: 74; }
  .filter-drawer-foot { display: flex; position: fixed; bottom: 0; right: 0; width: min(400px, 100%); background: var(--white); border-top: 1px solid var(--line); padding: 12px 16px; gap: 12px; z-index: 76; }
  .filter-drawer-foot .btn { flex: 1; }
  .mobile-filter-btn { display: inline-flex; }
  .shell { grid-template-columns: 1fr; }
  .side { position: sticky; top: 68px; height: auto; z-index: 30; display: flex; gap: 4px; overflow-x: auto; padding: 8px 12px; border-right: 0; border-bottom: 1px solid var(--line); }
  .side .role-tag, .side .side-cta, .side hr { display: none; }
  .side a { white-space: nowrap; flex: none; padding: 8px 12px; }
  .split { grid-template-columns: 1fr; }
  .split .left { border-right: 0; }
  .split.has-open .left { display: none; }
  .split:not(.has-open) .right { display: none; }
  .dash-grid { grid-template-columns: 1fr; }
  .steps { grid-template-columns: 1fr; }
  .sticky-contact { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 44; background: var(--white); border-top: 1px solid var(--line); padding: 12px 16px; gap: 12px; align-items: center; justify-content: space-between; box-shadow: 0 -4px 16px rgba(15, 23, 42, .08); }
  .has-sticky .compare-tray { bottom: 88px; }
  .dropdown { position: fixed; left: 8px; right: 8px; top: 120px; width: auto; }
}
@media (max-width: 640px) {
  .page { padding: 20px 16px 120px; }
  .header .in { padding: 0 16px; gap: 8px; }
  .logo small { display: none; }
  .t-page { font-size: 1.625rem; }
  .hero .in { padding: 32px 16px 32px; }
  .hero h1 { font-size: 2.125rem; }
  .hero p.lead { font-size: 1.0625rem; }
  .hero-search { grid-template-columns: 1fr; }
  .section { padding: 40px 16px; }
  .form-grid { grid-template-columns: 1fr; }
  .grid-cards { grid-template-columns: 1fr; gap: 16px; }
  .list-view .pcard { flex-direction: column; }
  .list-view .pcard .media { width: auto; aspect-ratio: 16 / 10; min-height: 0; }
  .footer .in { grid-template-columns: 1fr; }
  .panel { padding: 18px; }
  .list-item { flex-wrap: wrap; padding: 14px 16px; }
  .list-item .acts { width: 100%; justify-content: flex-start; }
  .list-item .thumb { width: 80px; height: 60px; }
  .auth-card { padding: 22px; }
  .compare-tray { left: 8px; right: 8px; transform: none; max-width: none; bottom: 8px; }
  .compare-tray .thumbs-mini { display: none; }
  .progress .lbl span.t { display: none; }
  .resp-table thead { display: none; }
  .resp-table, .resp-table tbody, .resp-table tr, .resp-table td { display: block; width: 100%; }
  .resp-table tr { border-bottom: 1px solid var(--line); padding: 12px 4px; }
  .resp-table td { border: 0; padding: 4px 12px; }
  .resp-table td[data-l]::before { content: attr(data-l); display: block; font-size: .75rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  #toasts { left: 8px; right: 8px; align-items: stretch; bottom: 80px; }
  .tiles { grid-template-columns: 1fr 1fr; }
  .tile .val { font-size: 1.625rem; }
}

/* ===== Interaction & accessibility layer ===== */
html[data-font="atkinson"] { --font: "Atkinson Hyperlegible", Arial, sans-serif; }
html[data-font="lexend"] { --font: Lexend, Arial, sans-serif; }
html[data-font="merriweather"] { --font: Merriweather, Georgia, serif; }
html[data-font="system"] { --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
html.xl-text { font-size: 125%; }
html.relaxed body { line-height: 1.85; letter-spacing: .012em; word-spacing: .06em; }
html.relaxed .stack-sm { gap: 12px; }
html.hc { --muted: #1E293B; --subtle: #334155; --line: #64748B; --line-strong: #334155; --surface: #FFFFFF; --slate-100: #E8EDF3; }
html.hc a { text-decoration: underline; text-underline-offset: 3px; }
html.hc .btn, html.hc .pchip, html.hc .badge, html.hc .choice, html.hc .ptile, html.hc .input, html.hc .select, html.hc .textarea { border-width: 2px; }
html.hc .btn-secondary { border-color: var(--ink); }
html.hl :focus-visible { box-shadow: 0 0 0 3px #fff, 0 0 0 7px #F59E0B !important; }
html.hl a:hover, html.hl button:hover, html.hl .pcard:hover, html.hl [role="button"]:hover { outline: 3px solid #F59E0B; outline-offset: 2px; }
.reading { outline: 3px solid #F59E0B !important; outline-offset: 3px; background-color: #FEF9C3 !important; border-radius: 8px; }
.flash { outline: 3px solid var(--blue); outline-offset: 6px; border-radius: 12px; }
[data-sec] { scroll-margin-top: 140px; }
main h1[tabindex="-1"]:focus { box-shadow: none; }
html.hl main h1[tabindex="-1"]:focus { box-shadow: none !important; }

/* Active place in navigation */
.nav a[aria-current="page"] { font-weight: 700; box-shadow: inset 0 -3px 0 var(--blue); border-radius: 8px 8px 0 0; }
.side a[aria-current="page"] { box-shadow: inset 4px 0 0 var(--blue); }

/* You are here trail */
.trail { background: var(--white); border-bottom: 1px solid var(--line); }
.trail .in { max-width: 1280px; margin: 0 auto; padding: 8px 24px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: .875rem; min-height: 48px; }
.trail .here { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); font-weight: 600; }
.trail .here .ic { color: var(--blue); }
.trail ol { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 2px; align-items: center; }
.trail li { display: inline-flex; align-items: center; }
.trail li + li::before { content: "›"; color: var(--subtle); margin: 0 6px; font-weight: 700; }
.trail a { color: var(--ink); padding: 4px 6px; border-radius: 6px; }
.trail a:hover { background: var(--slate-100); }
.trail [aria-current="page"] { background: var(--blue); color: #fff; font-weight: 700; padding: 4px 12px; border-radius: 999px; }
.trail-right { margin-left: auto; display: inline-flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.shell + .trail, header + .trail { position: relative; }

/* On this page */
.onpage { position: sticky; top: var(--hh, 68px); z-index: 35; background: var(--surface); backdrop-filter: blur(6px); display: flex; gap: 8px; align-items: center; overflow-x: auto; padding: 10px 0; margin: -8px 0 16px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.onpage > .t-support { display: inline-flex; gap: 6px; align-items: center; font-weight: 600; flex: none; }
.opchip { display: inline-flex; gap: 6px; align-items: center; border: 1.5px solid var(--line-strong); background: var(--white); border-radius: 999px; padding: 6px 12px; min-height: 40px; font-weight: 600; font-size: .875rem; cursor: pointer; color: var(--ink); flex: none; }
.opchip .ic { width: 16px; height: 16px; color: var(--blue); }
.opchip:hover { border-color: var(--blue); }
.opchip[aria-current="true"] { background: var(--night); color: #fff; border-color: var(--ink); }
.opchip[aria-current="true"] .ic { color: #fff; }

/* Pick-one chips */
.chipset { display: flex; flex-wrap: wrap; gap: 8px; }
.pchip { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 8px 14px; border-radius: 999px; border: 1.5px solid var(--line-strong); background: var(--white); font-weight: 500; cursor: pointer; font-size: .9375rem; color: var(--ink); transition: background .12s, border-color .12s; }
.pchip.sm { min-height: 40px; padding: 6px 12px; font-size: .875rem; }
.pchip .ic { width: 18px; height: 18px; color: var(--blue); }
.pchip:hover { border-color: var(--blue); background: var(--blue-50); }
.pchip[aria-checked="true"], .pchip[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 700; box-shadow: 0 2px 8px rgba(29, 78, 216, .28); }
.pchip[aria-checked="true"] .ic, .pchip[aria-pressed="true"] .ic { color: #fff; }
.pick-head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; margin-bottom: 8px; }
.pick-head legend { font-weight: 700; font-size: .9375rem; padding: 0; float: left; }
.picked { font-size: .8125rem; color: var(--muted); display: inline-flex; gap: 4px; align-items: center; }
.picked .ic { width: 14px; height: 14px; color: var(--green-text); }
.picked b { color: var(--blue-700); }
.pick-group + .pick-group { margin-top: 18px; }
.pick-group.compact { margin-top: 10px; }
.pick-group.has-error .pchip { border-color: var(--red-border); }
.pick-n { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--blue-50); color: var(--blue); font-size: .8125rem; font-weight: 700; margin-right: 8px; }
.hero-pick { margin-top: 28px; background: var(--white); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-lg); padding: 20px; }
.pick-summary { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.pick-summary > span { display: flex; gap: 8px; align-items: center; color: var(--muted); }
.pick-summary > span > .ic { color: var(--green-text); }
.pick-summary b { color: var(--ink); }
.tilegrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ptile { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 10px 12px; border: 1.5px solid var(--line-strong); border-radius: 12px; background: var(--white); cursor: pointer; min-height: 72px; text-align: left; font-weight: 600; font-size: .875rem; color: var(--ink); }
.ptile .ic { color: var(--blue); }
.ptile .st { font-size: .75rem; font-weight: 500; color: var(--muted); }
.ptile:hover { border-color: var(--blue); }
.ptile[aria-pressed="true"] { border-color: var(--blue); background: var(--blue); color: #fff; }
.ptile[aria-pressed="true"] .ic, .ptile[aria-pressed="true"] .st { color: #fff; }
.filters details.fine { margin-top: 10px; }
.filters details.fine summary { cursor: pointer; color: var(--blue); font-weight: 600; font-size: .875rem; min-height: 36px; display: flex; align-items: center; }
.choice { position: relative; }
.choice[aria-pressed="true"] { border-color: var(--blue); background: var(--blue-50); box-shadow: 0 0 0 1px var(--blue); }
.choice[aria-pressed="true"]::after { content: "Selected"; position: absolute; top: -11px; right: 12px; background: var(--blue); color: #fff; font-size: .6875rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; letter-spacing: .03em; text-transform: uppercase; }
.listen-btn { width: 36px; height: 36px; color: var(--blue); flex: none; border: 1px solid var(--line); }
.listen-btn .ic { width: 18px; height: 18px; }

/* Quick find */
.quick-btn kbd { font-family: inherit; font-size: .6875rem; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; background: var(--surface); }
.qf { position: fixed; inset: 0; z-index: 89; background: rgba(15, 23, 42, .5); display: flex; justify-content: center; align-items: flex-start; padding: 10vh 12px 12px; }
.qf-box { width: min(640px, 100%); background: var(--white); border-radius: var(--r-lg); box-shadow: var(--shadow-lg); max-height: 78vh; display: flex; flex-direction: column; overflow: hidden; }
.qf-top { display: flex; gap: 8px; padding: 12px; border-bottom: 1px solid var(--line); }
.qf-here { padding: 10px 16px 0; font-size: .875rem; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.qf-here .ic { color: var(--blue); }
.qf-res { overflow-y: auto; padding: 4px 0 8px; }
.qf-res ul { list-style: none; margin: 0; padding: 0; }
.qf-h { font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 12px 16px 4px; }
.qf-item { display: flex; width: 100%; gap: 12px; align-items: center; padding: 10px 16px; border: 0; background: none; text-align: left; cursor: pointer; min-height: 52px; color: var(--ink); }
.qf-item > .ic:first-child { color: var(--blue); }
.qf-item > span { flex: 1; }
.qf-item:hover, .qf-item:focus { background: var(--blue-50); outline: none; box-shadow: inset 4px 0 0 var(--blue); }

/* Dock, drawer, reader */
.a11y-dock { position: fixed; left: 16px; bottom: 16px; z-index: 46; display: flex; gap: 4px; background: var(--white); border: 1px solid var(--line); border-radius: 999px; padding: 4px; box-shadow: var(--shadow-lg); }
.a11y-dock button { display: inline-flex; gap: 6px; align-items: center; min-height: 44px; padding: 6px 14px; border-radius: 999px; border: 0; background: transparent; font-weight: 600; cursor: pointer; color: var(--ink); font-size: .9375rem; }
.a11y-dock button .ic { color: var(--blue); }
.a11y-dock button:hover { background: var(--blue-50); }
.a11y-dock button[aria-pressed="true"] { background: var(--night); color: #fff; }
.a11y-dock button[aria-pressed="true"] .ic { color: #fff; }
body.reading-on .compare-tray { display: none; }
.drawer-bg { position: fixed; inset: 0; background: rgba(15, 23, 42, .45); z-index: 87; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100%); background: var(--white); z-index: 88; overflow-y: auto; box-shadow: var(--shadow-lg); padding: 20px 20px 40px; }
.dp-preview { margin: 16px 0 8px; padding: 16px; border: 1px dashed var(--line-strong); border-radius: var(--r); background: var(--surface); display: flex; flex-direction: column; gap: 4px; }
.dp-sec { margin-top: 22px; }
.dp-sec .pick-head h3 { display: inline-flex; gap: 8px; align-items: center; }
.dp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.dcard { padding: 14px 12px; align-items: center; min-height: 64px; }
.dcard .dsample { font-size: 1.5rem; font-weight: 700; width: 40px; text-align: center; flex: none; color: var(--blue); }
.reader { position: fixed; left: 50%; transform: translateX(-50%); bottom: 16px; z-index: 86; background: var(--night); color: #fff; border-radius: 16px; padding: 10px 12px 10px 16px; display: flex; gap: 12px; align-items: center; box-shadow: var(--shadow-lg); width: min(860px, calc(100% - 300px)); flex-wrap: wrap; }
.reader-info { display: flex; gap: 10px; align-items: center; flex: 1; min-width: 200px; font-size: .875rem; }
.reader-info > .ic { color: #FCD34D; width: 22px; height: 22px; }
.reader-snip { display: block; color: #CBD5E1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 360px; }
.reader-ctl, .reader-speed { display: flex; gap: 4px; align-items: center; }
.reader-ctl button { width: 44px; height: 44px; border-radius: 50%; border: 1px solid #334155; background: transparent; color: #fff; display: grid; place-items: center; cursor: pointer; }
.reader-ctl button.big { background: #fff; color: #0F172A; }
.reader-ctl button[disabled] { opacity: .4; cursor: default; }
.reader-speed button { border: 1px solid #334155; background: transparent; color: #E2E8F0; border-radius: 999px; padding: 6px 10px; font-size: .8125rem; font-weight: 600; cursor: pointer; min-height: 36px; }
.reader-speed button[aria-checked="true"] { background: #FCD34D; color: #0F172A; border-color: #FCD34D; }
@media (max-width: 900px) {
  .trail .in { padding: 8px 16px; }
  .trail .here { display: none; }
  .trail-right .badge { display: none; }
  .onpage { top: 68px; margin: -4px -16px 16px; padding: 8px 16px; }
  .reader { width: calc(100% - 16px); bottom: 8px; left: 8px; right: 8px; transform: none; }
  .reader-snip { max-width: 60vw; }
  body.has-sticky .a11y-dock { bottom: 88px; }
  body.has-tray .a11y-dock { bottom: 80px; }
  body.has-sticky.has-tray .a11y-dock { bottom: 160px; }
  body.reading-on .a11y-dock { display: none; }
  .dp-grid { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .a11y-dock { left: 8px; bottom: 8px; }
  .a11y-dock button { padding: 6px 12px; }
  .hero-pick { padding: 16px; }
  .pick-summary .btn { width: 100%; }
  .trail-right .btn { padding: 4px 8px; }
}
@media (max-width: 640px) {
  .trail li:not(:nth-last-child(-n+2)) { display: none; }
  .trail li:nth-last-child(2)::before { content: none; }
  .trail-right { display: none; }
  .trail [aria-current="page"] { max-width: 62vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block; }
}

.pcard .media .save-btn, .gallery-main .nav-btn, .lheart { color: #0F172A; }
.pcard .media .save-btn[aria-pressed="true"], .lheart[aria-pressed="true"] { color: #B91C1C; }

/* ===== Public header (two rows) ===== */
body.ph-page { --hh: 72px; }
body.ph-page .a11y-dock { display: none; }
.header.ph .in { max-width: 1440px; height: 72px; gap: 16px; padding: 0 24px; }
.logo-mark2 { width: 44px; height: 44px; display: grid; place-items: center; color: var(--blue); }
.logo-mark2 .ic { width: 40px; height: 40px; stroke-width: 2.2; }
.header.ph .logo { font-size: 1.1875rem; font-weight: 800; letter-spacing: -.02em; }
.header.ph .logo small { font-size: .75rem; font-weight: 500; color: var(--ink); letter-spacing: 0; }
.hsearch { flex: 1; display: flex; gap: 8px; max-width: 600px; min-width: 260px; }
.hsearch .input-icon { flex: 1; }
.hsearch .input { border-radius: 999px; min-height: 44px; font-size: .9375rem; }
.hsearch .btn { border-radius: 10px; padding: 10px 20px; }
.hctl { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.tool-btn { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-width: 64px; height: 52px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--white); cursor: pointer; font-size: .75rem; font-weight: 600; color: var(--ink); }
.tool-btn .ic { width: 20px; height: 20px; }
.tool-btn:hover { border-color: var(--blue); background: var(--blue-50); }
.tool-btn[aria-pressed="true"] { border-color: var(--blue); color: var(--blue); }
.drop-btn { display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--white); cursor: pointer; font-weight: 600; font-size: .875rem; color: var(--ink); white-space: nowrap; }
.drop-btn .aa { color: var(--blue); }
.drop-btn .ic { width: 16px; height: 16px; }
.drop-btn:hover, .drop-btn[aria-expanded="true"] { border-color: var(--blue); }
.btn-outline { background: var(--white); color: var(--blue); border: 1.5px solid var(--blue); }
.btn-outline:hover { background: var(--blue-50); }
.qf-m { display: none; }
.hmenu { position: absolute; top: calc(100% + 8px); right: 0; z-index: 65; background: var(--white); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-lg); padding: 8px; min-width: 260px; display: flex; flex-direction: column; gap: 2px; }
.nav2 .hmenu { left: 0; right: auto; }
.hmenu-h { font-size: .75rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding: 8px 8px 6px; }
.hmenu .chipset { padding: 0 8px 6px; }
.hmenu-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 10px 10px; min-height: 44px; border: 0; border-radius: 8px; background: transparent; cursor: pointer; color: var(--ink); text-decoration: none; font-size: .9375rem; }

.navrow { background: var(--white); border-bottom: 1px solid var(--line); }
.navrow .in { max-width: 1440px; margin: 0 auto; padding: 8px 24px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.nav2 { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.nav2 .nl { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 8px 14px; border-radius: 10px; color: var(--ink); text-decoration: none; font-weight: 600; font-size: .9375rem; background: transparent; border: 0; cursor: pointer; }
.nav2 .nl .ic { width: 20px; height: 20px; }

.nav2 .nl[aria-current="page"], .nav2 .nl.is-cur { background: var(--blue); color: #fff; }

.here-trail { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: .9375rem; color: var(--ink); min-width: 0; }

.here-trail ol { list-style: none; margin: 0; padding: 0; display: flex; align-items: center; flex-wrap: wrap; min-width: 0; }
.here-trail li { display: inline-flex; align-items: center; }
.here-trail li + li::before { content: "›"; margin: 0 6px; color: var(--subtle); font-weight: 700; }
.here-trail a { color: var(--ink); }
.here-trail [aria-current="page"] { color: var(--blue); font-weight: 700; max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block; vertical-align: bottom; }

/* ===== Landing hero ===== */
.hero2 { position: relative; background: linear-gradient(90deg, #E8F0FE 0%, #EEF4FF 42%, #F3F7FF 100%); border-bottom: 1px solid var(--line); }
.hero2-img { position: absolute; top: 0; right: 0; bottom: 0; width: 58%; }
.hero2-img img { width: 100%; height: 100%; object-fit: cover; object-position: 60% center; }
.hero2-img::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, #EEF4FF 0%, rgba(238, 244, 255, .85) 10%, rgba(238, 244, 255, 0) 32%); z-index: 1; }
.hero2 .in { position: relative; z-index: 2; max-width: 1440px; margin: 0 auto; padding: 44px 24px 40px 64px; min-height: 330px; }

.hf-txt { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }

.hf-val.picked-val { color: var(--blue); font-weight: 700; }
.hf-menu { left: 0; right: auto; width: 340px; }
.hb-go { min-width: 132px; font-size: 1.0625rem; border-radius: 10px; }

/* ===== Featured cards ===== */
.feat-head { margin-bottom: 18px; align-items: flex-end; }
.feat-head h2, .howband h2 { font-size: 2rem; font-weight: 800; letter-spacing: -.02em; }
.feat-head p { color: var(--ink); margin-top: 4px; }
.view-all { display: inline-flex; gap: 6px; align-items: center; font-weight: 700; font-size: 1.0625rem; text-decoration: none; color: var(--blue); }
.view-all:hover { text-decoration: underline; }
.lgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px; }

.ltitle { font-size: 1.1875rem; font-weight: 800; color: var(--ink); text-decoration: none; letter-spacing: -.01em; }
.ltitle:hover { text-decoration: underline; }
.lmeta { display: flex; align-items: center; gap: 10px; font-size: .875rem; flex-wrap: wrap; }
.lmeta > span { display: inline-flex; align-items: center; gap: 6px; }
.lmeta .ic { width: 16px; height: 16px; }
.lmeta .sep { width: 1px; height: 16px; background: var(--line-strong); }

.lchips > span { display: inline-flex; align-items: center; gap: 6px; font-size: .8125rem; font-weight: 500; background: var(--slate-100); padding: 4px 10px; border-radius: 999px; }

function filterProps(f = state.filters) {
  const q = f.q.trim().toLowerCase();
  let list = visibleProps().filter(p =>
    (!q || p.area.toLowerCase().includes(q) || p.title.toLowerCase().includes(q) || p.landmark.toLowerCase().includes(q)) &&
    p.rent >= f.min && p.rent <= f.max && p.dist <= f.dist &&
    (!f.types.length || f.types.includes(p.type)) &&
    (f.self === "any" || (f.self === "self" ? p.selfContained : !p.selfContained)) &&
    (!f.water || p.water) && (!f.electricity || p.electricity) && (!f.privateBath || p.bath === "private") && (!f.security || p.security) &&
    (f.rooms === "any" || (f.rooms === "2" ? p.rooms >= 2 : p.rooms === 1)) &&
    (!f.availOnly || p.avail === "available"));
  const s = state.sort;
  list.sort((a, b) => s === "price-asc" ? a.rent - b.rent : s === "price-desc" ? b.rent - a.rent : s === "dist-asc" ? a.dist - b.dist :
    (a.avail === b.avail ? a.dist - b.dist : a.avail === "available" ? -1 : 1));
  return list;
}
function filterChips(f = state.filters) {
  const d = DEFAULT_FILTERS(), c = [];
  if (f.q) c.push(["q", `Location: ${f.q}`]);

  if (f.max !== d.max) c.push(["max", `Max ${fmt(f.max)} RWF`]);
  if (f.dist !== d.dist) c.push(["dist", `Within ${f.dist} km`]);
  f.types.forEach(t => c.push(["type:" + t, TYPES[t]]));
  if (f.self !== "any") c.push(["self", f.self === "self" ? "Self-contained" : "Shared facilities"]);
  if (f.water) c.push(["water", "Water"]);
  if (f.electricity) c.push(["electricity", "Electricity"]);
  if (f.privateBath) c.push(["privateBath", "Private bathroom"]);
  if (f.security) c.push(["security", "Security"]);

  if (opts.undo) toastActions[id] = opts.undo;

  el.addEventListener("click", e => {
    if (e.target.closest("[data-undo]")) { clearTimeout(t); el.remove(); toastActions[id] && toastActions[id](); delete toastActions[id]; }

}

function mapSvg({ pinArea, pinXY, interactive = false, small = false } = {}) {
  const W = 640, H = small ? 300 : 340, cx = 320, cy = H / 2, scale = 52;
  const pos = l => [cx + Math.cos(l.angle * Math.PI / 180) * l.km * scale, cy - Math.sin(l.angle * Math.PI / 180) * l.km * scale];
  const areas = state.locations.map(l => { const [x, y] = pos(l); return `<g><circle cx="${x}" cy="${y}" r="4" fill="#94A3B8"/><text x="${x + 8}" y="${y - 6}" font-size="13" font-family="Inter,Arial" fill="#334155">${esc(l.name)}</text></g>`; }).join("");
  let pin = "";
  const pl = pinArea && locByName(pinArea);
  const pp = pinXY ? [pinXY.x * W, pinXY.y * H] : pl ? pos(pl) : null;
  if (pp) pin = `<g transform="translate(${pp[0]},${pp[1]})"><path d="M0 0c-9-12-14-18-14-25a14 14 0 0 1 28 0c0 7-5 13-14 25z" fill="#1D4ED8" stroke="#fff" stroke-width="2.5" transform="translate(0,0)"/><circle cx="0" cy="-25" r="5" fill="#fff"/></g>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Schematic map around UR-CST${pinArea ? `, showing ${esc(pinArea)}` : ""}. Not to scale." ${interactive ? 'class="pin-map" data-a="map-pin"' : ""}>
  <rect width="${W}" height="${H}" fill="#EEF3EE"/>
  <path d="M0 ${H * .7} C160 ${H * .55} 260 ${H * .9} 420 ${H * .72} S600 ${H * .5} ${W} ${H * .62}" stroke="#fff" stroke-width="14" fill="none"/>
  <path d="M${W * .2} 0 C${W * .3} ${H * .3} ${W * .45} ${H * .45} ${W * .5} ${H} " stroke="#fff" stroke-width="10" fill="none"/>
  <path d="M${W * .78} 0 C${W * .7} ${H * .3} ${W * .62} ${H * .5} ${W * .55} ${H}" stroke="#fff" stroke-width="8" fill="none"/>
  <path d="M0 ${H * .25} H${W}" stroke="#fff" stroke-width="6" fill="none"/>
  ${[1, 2, 3].map(k => `<circle cx="${cx}" cy="${cy}" r="${k * scale}" fill="none" stroke="#94A3B8" stroke-dasharray="4 6"/><text x="${cx + k * scale - 6}" y="${cy + 14}" font-size="11" font-family="Inter,Arial" fill="#64748B">${k} km</text>`).join("")}
  ${areas}
  <g transform="translate(${cx},${cy})"><rect x="-44" y="-14" width="88" height="28" rx="8" fill="#0F172A"/><text x="0" y="5" text-anchor="middle" font-size="13" font-weight="700" font-family="Inter,Arial" fill="#fff">UR-CST</text></g>
  ${pin}
  <text x="12" y="${H - 12}" font-size="11" font-family="Inter,Arial" fill="#64748B">Schematic map · not to scale · demonstration</text></svg>`;
}

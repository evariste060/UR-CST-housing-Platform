      ${field({ id: "rg-phone", label: r === "landlord" ? "Phone number" : "Phone number (optional)", type: "tel", value: fv("rg-phone"), placeholder: "e.g. 0788 000 000", required: r === "landlord", help: r === "landlord" ? "Shown to students on your listings." : "" })}
      ${field({ id: "rg-pw", label: "Password", type: "password", value: fv("rg-pw"), help: "At least 8 characters.", required: true })}
      ${field({ id: "rg-pw2", label: "Confirm password", type: "password", value: fv("rg-pw2"), required: true })}
      <div class="full field ${state.errors["rg-terms"] ? "has-error" : ""}"><label class="check"><input type="checkbox" id="rg-terms" data-f="form-check" ${fv("rg-terms") ? "checked" : ""} ${state.errors["rg-terms"] ? 'aria-invalid="true" aria-describedby="rg-terms-err"' : ""}> I agree to the <button type="button" class="link-btn" data-a="info-modal" data-k="terms">Terms</button> and <button type="button" class="link-btn" data-a="info-modal" data-k="privacy">Privacy</button></label>${state.errors["rg-terms"] ? `<p class="err-msg" id="rg-terms-err">${icon("alert")}${state.errors["rg-terms"]}</p>` : ""}</div>
    </div><button class="btn btn-primary btn-lg btn-block" type="submit">Create Account</button></form>`;
  return publicHeader() + `<main id="main" class="auth-wrap"><div class="auth-card wide">${body}<p style="margin-top:20px;text-align:center">Already have an account? <a href="#login">Log in</a></p></div></main>`;
};

VIEWS.forgot = () => publicHeader() + `<main id="main" class="auth-wrap"><div class="auth-card">
  ${state.resetSent ? `<div class="state success" style="border:0;padding:8px"><div class="state-ic">${icon("mail")}</div><h3>Check your email</h3><p>If an account exists for <b>${esc(fv("fp-email"))}</b>, we have sent a link to reset your password.</p>
    <div class="notice" style="text-align:left">${icon("info")}<span>Prototype: no email is sent. Open the simulated link below to continue.</span></div>
    <div class="row"><a class="btn btn-primary" href="#reset">Open reset link (simulated)</a><a class="btn btn-secondary" href="#login">Back to Login</a></div></div>`
    : `<h1 class="t-page" style="font-size:1.75rem">Reset your password</h1><p class="muted" style="margin-top:6px">Enter the email you registered with. We will send you a reset link.</p>
    <form class="stack" data-form="forgot" style="margin-top:20px" novalidate>${field({ id: "fp-email", label: "Email address", type: "email", value: fv("fp-email"), placeholder: "name@example.com" })}
    <button class="btn btn-primary btn-lg btn-block" type="submit">Send Reset Link</button></form><p style="margin-top:20px;text-align:center"><a href="#login">${icon("chevL")} Back to Login</a></p>`}
</div></main>`;

VIEWS.reset = () => publicHeader() + `<main id="main" class="auth-wrap"><div class="auth-card"><h1 class="t-page" style="font-size:1.75rem">Choose a new password</h1><p class="muted" style="margin-top:6px">Simulated reset page for prototype testing.</p>
  <form class="stack" data-form="reset" style="margin-top:20px" novalidate>${field({ id: "rs-pw", label: "New password", type: "password", value: fv("rs-pw"), help: "At least 8 characters." })}${field({ id: "rs-pw2", label: "Confirm new password", type: "password", value: fv("rs-pw2") })}
  <button class="btn btn-primary btn-lg btn-block" type="submit">Save new password</button></form></div></main>`;

/* ============ Search ============ */
function resultsRegion() {
  if (state.sim.error) return emptyState({ ic: "wifi", tone: "error", title: "Unable to load accommodation. Please try again.", text: "Check your internet connection. Your filters are kept, so you will not need to set them again.", actions: `<button class="btn btn-primary" data-a="retry">${icon("refresh")}Try again</button>` });
  if (Date.now() < state.loadingUntil) return skeletonCards(3);
  const list = filterProps(), chips = filterChips();
  const n = list.length;
  const top = `<p class="result-count" aria-live="polite" id="res-count">${n === 0 ? "No places match" : `${n} place${n === 1 ? "" : "s"} match${n === 1 ? "es" : ""} your search`}</p>`;
  const chipHtml = chips.length ? `<div class="chips" aria-label="Applied filters">${chips.map(([k, l]) => `<span class="chip">${esc(l)}<button data-a="chip-x" data-k="${k}" aria-label="Remove filter ${esc(l)}">${icon("x")}</button></span>`).join("")}<button class="link-btn" data-a="clear-filters">Clear all filters</button></div>` : "";
  const f = state.filters;
  const body = n ? `<div class="grid-cards ${state.view === "list" ? "list-view" : ""}">${list.map(card).join("")}</div>`
    : emptyState({ ic: "search", title: "No accommodation matches your search.", text: "Try one of these changes. Each one updates the results straight away.", actions: `${f.max < 250000 ? `<button class="btn btn-secondary" data-a="es-budget">${icon("plus")}Increase budget to ${fmt(Math.min(250000, f.max + 30000))} RWF</button>` : ""}${f.dist < 5 ? `<button class="btn btn-secondary" data-a="es-dist">${icon("route")}Expand distance to ${Math.min(5, f.dist + 1)} km</button>` : ""}<button class="btn btn-secondary" data-a="es-filters">${icon("filter")}Remove facility &amp; type filters</button><button class="btn btn-primary" data-a="clear-filters">View all properties</button>` });
  return `<div class="toolbar">${top}</div>${chipHtml}${body}`;
}
function updateResults() {
  const r = $("#results-region"); if (r) r.innerHTML = resultsRegion();
  const d = $("#drawer-count"); if (d) d.textContent = `Show ${filterProps().length} results`;
  const f = state.filters;
  [["out-min", fmt(f.min)], ["out-max", fmt(f.max)], ["out-dist", f.dist]].forEach(([id, v]) => { const el = document.getElementById(id); if (el) el.textContent = v; });
  const mf = $("#mf-count"); if (mf) mf.textContent = filterChips().length || "";
}
VIEWS.search = () => {
  const nChips = filterChips().length;
  return publicHeader() + `<main class="page" id="main">
  <div class="page-head"><div><h1 class="t-page">Find accommodation near UR-CST</h1><p class="muted">Prices are per month in RWF. Distances are approximate walking-route estimates from the campus gate.</p></div>
  ${state.user && state.user.role === "student" ? "" : `<a class="btn btn-secondary btn-sm" href="#saved">${icon("heart")}Saved (${state.saved.length})</a>`}</div>
  <form class="searchbar" data-form="searchbar" role="search"><div class="input-icon">${icon("search")}<label for="s-q" class="sr-only">Search by neighbourhood or landmark</label><input class="input" id="s-q" data-f="q" value="${esc(state.filters.q)}" placeholder="Search a neighbourhood, e.g. Kiyovu, Muhima" autocomplete="off"></div><button class="btn btn-primary" type="submit">Search</button></form>
  <div class="toolbar"><button class="btn btn-secondary mobile-filter-btn" data-a="filters-toggle" aria-expanded="${state.filtersOpen}" aria-controls="filters">${icon("filter")}Filters <span class="count-pill" id="mf-count">${nChips || ""}</span></button>
  <div class="row" style="margin-left:auto">${sortChips()}
  <div class="seg" role="group" aria-label="Layout"><button data-a="view" data-v="grid" aria-pressed="${state.view === "grid"}">${icon("grid")}<span class="sr-only">Grid view</span></button><button data-a="view" data-v="list" aria-pressed="${state.view === "list"}">${icon("list")}<span class="sr-only">List view</span></button></div></div></div>
  <div class="search-layout">${filtersPanel()}<section id="results-region" aria-label="Results">${resultsRegion()}</section></div>
  </main>${compareTray()}` + footer();
};
function compareTray() {
  if (!state.compare.length || state.route === "compare") return "";
  const ps = state.compare.map(prop);
  return `<div class="compare-tray" role="region" aria-label="Compare selection">${icon("compare")}<span><b>${ps.length}</b> of 4 selected</span><span class="thumbs-mini">${ps.map(p => `<img src="${coverImg(p)}" alt="${esc(p.title)}">`).join("")}</span><a class="btn btn-primary btn-sm" href="#compare">${ps.length < 2 ? "Open compare" : "Compare now"}</a><button class="btn btn-secondary btn-sm" data-a="compare-clear">Clear</button></div>`;
}

/* ============ Property details ============ */
function propertyBody(p, { preview = false } = {}) {
  const ph = fullPhotos(p), gi = Math.min(state.gallery[p.id] || 0, ph.length - 1), ll = landlordOf(p) || { name: "You (preview)", phone: "" };
  const open = state.descOpen[p.id];
  const fac = (ok, ic, l, s) => `<div class="facility ${ok ? "yes" : "no"}"><span class="fi">${icon(ic)}</span><span><b>${l}</b><span class="st">${icon(ok ? "check" : "x")}${s}</span></span></div>`;
  const occupied = p.avail !== "available";
  const loc = locByName(p.area);
  return `<div class="two-col">
  <div class="stack" style="gap:28px">
    <section aria-label="Photos" id="sec-photos" data-sec="Photos"><div class="gallery-main"><img src="${ph[gi]}" alt="${esc(p.title)}, demonstration photo ${gi + 1} of ${ph.length}">
      ${ph.length > 1 ? `<button class="nav-btn prev" data-a="gal" data-id="${p.id}" data-d="-1" aria-label="Previous photo">${icon("chevL")}</button><button class="nav-btn next" data-a="gal" data-id="${p.id}" data-d="1" aria-label="Next photo">${icon("chevR")}</button>` : ""}
      <span class="counter num">${gi + 1} / ${ph.length}</span><button class="btn btn-secondary btn-sm fs" data-a="lightbox" data-id="${p.id}">${icon("expand")}Full screen</button></div>
      <div class="thumbs" role="group" aria-label="Choose photo">${ph.map((s, i) => `<button data-a="gal-set" data-id="${p.id}" data-i="${i}" aria-current="${i === gi}" aria-label="Show photo ${i + 1}"><img src="${s}" alt=""></button>`).join("")}</div></section>
    <section class="panel" aria-labelledby="fac-h" id="sec-fac" data-sec="Facilities"><h2 class="t-section" id="fac-h">Facilities</h2><div class="facility-grid" style="margin-top:16px">
      ${fac(p.water, "water", "Water", p.water ? "Included" : "Not included")}${fac(p.electricity, "bolt", "Electricity", p.electricity ? "Included" : "Not included (prepaid by tenant)")}
      ${fac(true, "bath", "Bathroom", p.bath === "private" ? "Private bathroom" : "Shared with other tenants")}${fac(p.security, "shield", "Security", p.security ? "Guard or locked gate" : "No guard")}
      ${fac(true, "home", "Layout", p.selfContained ? "Self-contained (private kitchen/bath)" : "Shared kitchen and facilities")}</div></section>
    <section class="panel" aria-labelledby="desc-h" id="sec-about" data-sec="About"><h2 class="t-section" id="desc-h">About this place</h2><p class="desc ${open ? "" : "clamp"}" style="margin-top:12px" id="desc-${p.id}">${esc(p.desc)}</p>${p.desc.length > 180 ? `<button class="link-btn" data-a="desc-toggle" data-id="${p.id}" aria-expanded="${!!open}" aria-controls="desc-${p.id}">${open ? "Show less" : "Show more"}</button>` : ""}</section>
    <section class="panel" aria-labelledby="loc-h" id="sec-loc" data-sec="Location"><h2 class="t-section" id="loc-h">Location</h2><p class="muted" style="margin-top:6px">${icon("pin")} ${esc(p.area)} · ${esc(p.landmark)}</p><div class="map" style="margin-top:12px">${mapSvg({ pinArea: p.area, pinXY: p.pin })}</div>
      <ul class="landmarks"><li><span>UR-CST campus gate</span><b class="num">${p.dist} km</b></li><li><span>Nearest landmark: ${esc(p.landmark)}</span><b>Nearby</b></li><li><span>Neighbourhood centre: ${esc(p.area)}</span><b class="num">${loc ? loc.km + " km from campus" : "-"}</b></li></ul></section>
  </div>
  <aside class="stack sticky" aria-label="Price and contact">
    <div class="panel" id="sec-price" data-sec="Price"><div class="row" style="gap:8px">${availBadge(p)}${reviewBadge(p)}</div>
      <p style="margin-top:14px"><span class="t-page num" style="font-size:2rem">${rwf(p.rent)}</span> <span class="muted">/ month</span></p>
      <p class="row" style="margin-top:6px;font-weight:600;gap:6px">${icon("pin")}<span class="num">${p.dist} km from UR-CST</span></p>
      <hr class="divider"><dl class="kv"><dt>Room type</dt><dd>${TYPES[p.type]}</dd><dt>Number of rooms</dt><dd class="num">${p.rooms}</dd><dt>Facilities</dt><dd>${facilityLabel(p)}</dd><dt>Neighbourhood</dt><dd>${esc(p.area)}</dd></dl>
      ${occupied ? `<div class="notice warn" style="margin-top:16px">${icon("door")}<span><b>Currently occupied.</b> You can still save it or ask the landlord when it will be free.</span></div>` : ""}
      <p class="t-help" style="margin-top:12px">${p.review === "approved" ? `${icon("info")} "Approved by admin" means the listing details were checked. It does not confirm today's availability. Ask the landlord.` : `${icon("info")} This listing has not been approved yet. Students cannot see it.`}</p>
      ${preview ? "" : `<div class="stack-sm" style="margin-top:16px"><a class="btn btn-primary btn-lg btn-block" href="#contact-${p.id}">${icon("message")}${occupied ? "Ask about future availability" : "Contact landlord"}</a>
      <div class="row" style="gap:8px">${saveBtn(p, "btn btn-secondary save-btn").replace("</button>", `${isSaved(p.id) ? "Saved" : "Save property"}</button>`).replace('class="btn btn-secondary save-btn"', 'class="btn btn-secondary save-btn" style="flex:1"')}<button class="btn btn-secondary" style="flex:1" data-a="compare-toggle" data-id="${p.id}" aria-pressed="${inCompare(p.id)}">${icon(inCompare(p.id) ? "check" : "compare")}${inCompare(p.id) ? "In compare" : "Add to compare"}</button></div>
      <button class="link-btn" data-a="report" data-id="${p.id}" style="align-self:flex-start;color:var(--muted)">${icon("flag")} Report a problem with this listing</button></div>`}</div>
    <div class="panel" id="sec-landlord" data-sec="Landlord"><h2 class="t-card">Landlord</h2><div class="row" style="margin-top:12px"><span class="avatar">${initials(ll.name)}</span><span><b>${esc(ll.name)}</b><span class="t-support" style="display:block">Demonstration landlord</span></span></div>
      ${preview ? "" : `<div class="stack-sm" style="margin-top:14px">${ll.phoneOn !== false ? `<a class="btn btn-secondary btn-block" href="#contact-${p.id}" data-a="pick-method" data-m="phone" data-id="${p.id}">${icon("phone")}Phone</a>` : ""}${ll.whatsapp ? `<a class="btn btn-secondary btn-block" href="#contact-${p.id}" data-a="pick-method" data-m="whatsapp" data-id="${p.id}">${icon("whatsapp")}WhatsApp</a>` : ""}${ll.inapp ? `<a class="btn btn-secondary btn-block" href="#contact-${p.id}" data-a="pick-method" data-m="inapp" data-id="${p.id}">${icon("message")}In-app message</a>` : ""}</div>`}</div>
  </aside></div>
  ${preview ? "" : `<div class="sticky-contact"><span><b class="num">${rwf(p.rent)}</b><span class="t-support" style="display:block">${p.dist} km · ${occupied ? "Occupied" : "Available"}</span></span><span class="row" style="gap:8px">${saveBtn(p)}<a class="btn btn-primary" href="#contact-${p.id}">${icon("message")}Contact</a></span></div>`}`;
}
VIEWS.property = id => {
  const p = prop(id);
  const owner = p && state.user && (state.user.role === "admin" || state.user.landlordId === p.landlordId);
  if (!p || (p.review !== "approved" && !owner)) return publicHeader() + `<main class="page" id="main">${emptyState({ ic: "home", title: "This listing is not available", text: "It may have been removed or is still waiting for review.", actions: `<a class="btn btn-primary" href="#search">Back to search</a>` })}</main>`;
  if (p.review === "approved") addRecent(id);
  return publicHeader() + `<main class="page" id="main">
  <div class="page-head"><div><h1 class="t-page">${esc(p.title)}</h1><p class="muted">${typeLabel(p)} · ${esc(p.area)}, Kigali</p></div><button class="btn btn-secondary" data-a="speak-prop" data-id="${p.id}" data-full="1">${icon("volume")}Listen to this property</button></div>${onPage(["sec-photos", "Photos", "image"], ["sec-price", "Price & availability", "check"], ["sec-fac", "Facilities", "bolt"], ["sec-about", "About", "doc"], ["sec-loc", "Location", "pin"], ["sec-landlord", "Landlord", "user"])}${propertyBody(p)}</main>${compareTray()}` + footer();
};

/* ============ Saved ============ */
VIEWS.saved = () => {
  const list = state.saved.map(prop).filter(Boolean);
  const sel = state.savedSelect.filter(id => state.saved.includes(id));
  return publicHeader() + `<main class="page" id="main"><div class="page-head"><div><h1 class="t-page">Saved properties</h1><p class="muted">Saving a property keeps it on this list. It does not reserve the room.</p></div>
  ${list.length >= 2 ? `<button class="btn btn-primary" data-a="saved-compare" ${sel.length < 2 ? "aria-disabled=\"true\"" : ""}>${icon("compare")}Compare selected (${sel.length})</button>` : ""}</div>
  ${list.length ? `${list.length >= 2 ? `<p class="tip" style="margin-bottom:16px">${icon("info")}Tick two to four properties, then select "Compare selected".</p>` : ""}<div class="list">${list.map(p => `<div class="list-item"><label class="check" style="min-height:44px"><input type="checkbox" data-f="saved-sel" value="${p.id}" ${sel.includes(p.id) ? "checked" : ""}><span class="sr-only">Select ${esc(p.title)} to compare</span></label><img class="thumb" src="${coverImg(p)}" alt=""><div class="grow"><a class="t-card" href="#property-${p.id}" style="color:var(--ink)">${esc(p.title)}</a><p class="num" style="margin-top:2px"><b>${rwf(p.rent)}</b> <span class="muted">/ month · ${p.dist} km from UR-CST · ${typeLabel(p)}</span></p><div class="status-pair">${availBadge(p)}</div></div><div class="acts"><a class="btn btn-secondary btn-sm" href="#property-${p.id}">View details</a><button class="btn btn-danger-outline btn-sm" data-a="save" data-id="${p.id}">${icon("trash")}Remove</button></div></div>`).join("")}</div>`
    : emptyState({ ic: "heart", title: "You haven't saved any properties yet.", text: "Tap the heart on any property to keep it here, so you don't need to remember its name later.", actions: `<a class="btn btn-primary" href="#search">${icon("search")}Explore accommodation</a>` })}
  </main>${compareTray()}` + footer();
};

/* ============ Compare ============ */
VIEWS.compare = () => {
  const ps = state.compare.map(prop).filter(Boolean);
  const others = visibleProps().filter(p => !inCompare(p.id));
  const addCtl = `<form class="row" data-form="cmp-add" style="flex-wrap:nowrap;max-width:100%"><label for="cmp-add" class="sr-only">Add a property to compare</label><select class="select" id="cmp-add" style="width:auto;min-width:0;max-width:340px;flex:1"><option value="">Add a property…</option>${others.map(p => `<option value="${p.id}">${esc(p.title)} · ${fmt(p.rent)} RWF</option>`).join("")}</select><button class="btn btn-secondary" type="submit">${icon("plus")}Add</button></form>`;
  let body;
  if (ps.length < 2) body = emptyState({ ic: "compare", title: ps.length ? "Add one more property to compare" : "Nothing to compare yet", text: "Select Compare on two to four properties. You can also add one here.", actions: `<a class="btn btn-primary" href="#search">${icon("search")}Return to search</a>` }) + `<div style="margin-top:16px">${addCtl}</div>` + (ps.length ? `<div class="grid-cards" style="margin-top:16px">${ps.map(card).join("")}</div>` : "");
  else {
    const minRent = Math.min(...ps.map(p => p.rent)), minDist = Math.min(...ps.map(p => p.dist));
    const yn = (v, yes = "Included", no = "Not included") => v ? `<span class="yes-txt">${icon("check")}${yes}</span>` : `<span class="no-txt">${icon("x")}${no}</span>`;
    const rows = [
      ["Monthly rent", p => `<b class="num">${rwf(p.rent)}</b>${p.rent === minRent ? ` <span class="badge b-available best">Lowest</span>` : ""}`, p => p.rent],
      ["Distance", p => `<b class="num">${p.dist} km</b>${p.dist === minDist ? ` <span class="badge b-available best">Closest</span>` : ""}`, p => p.dist],
      ["Location", p => esc(p.area), p => p.area],
      ["Accommodation type", p => `${typeLabel(p)}<br><span class="t-support">${facilityLabel(p)}</span>`, p => p.type + p.selfContained],
      ["Water", p => yn(p.water), p => p.water],
      ["Electricity", p => yn(p.electricity), p => p.electricity],
      ["Bathroom", p => p.bath === "private" ? `<span class="yes-txt">${icon("check")}Private</span>` : `<span class="no-txt">${icon("users")}Shared</span>`, p => p.bath],
      ["Security", p => yn(p.security, "Guard / locked gate", "No guard"), p => p.security],
      ["Availability", p => availBadge(p), p => p.avail],
    ];
    body = `<div class="row-between" style="margin-bottom:16px"><p class="tip">${icon("info")}Rows marked "Differs" are where these properties are not the same.</p>${ps.length < 4 ? addCtl : `<span class="t-support">${icon("info")} Maximum of four reached.</span>`}</div>
    <div class="table-wrap"><table class="cmp"><caption class="sr-only">Side-by-side comparison of ${ps.length} properties</caption><thead><tr><th scope="col">Property</th>${ps.map(p => `<th scope="col" class="head-cell" style="text-transform:none;letter-spacing:0;color:var(--ink);font-size:1rem"><img src="${coverImg(p)}" alt=""><a href="#property-${p.id}" style="display:block;margin-top:8px;color:var(--ink)">${esc(p.title)}</a><div class="row" style="margin-top:8px;gap:6px"><a class="btn btn-secondary btn-sm" href="#property-${p.id}">Details</a><button class="btn btn-ghost btn-sm" data-a="compare-toggle" data-id="${p.id}">${icon("x")}Remove</button></div></th>`).join("")}</tr></thead>
    <tbody>${rows.map(([l, fn, key]) => { const diff = new Set(ps.map(key).map(String)).size > 1; return `<tr class="${diff ? "diff" : ""}"><th scope="row">${l}</th>${ps.map(p => `<td>${fn(p)}</td>`).join("")}</tr>`; }).join("")}
    <tr><th scope="row">Action</th>${ps.map(p => `<td><a class="btn btn-primary btn-sm" href="#contact-${p.id}">${icon("message")}Contact</a></td>`).join("")}</tr></tbody></table></div>`;
  }
  return publicHeader() + `<main class="page" id="main"><div class="page-head"><div><h1 class="t-page">Compare properties</h1><p class="muted">Compare up to four properties side by side.</p></div>${ps.length ? `<button class="btn btn-secondary" data-a="compare-clear">Clear comparison</button>` : ""}</div>${body}</main>` + footer();
};

/* ============ History ============ */
VIEWS.history = () => {
  const rec = state.recent.map(prop).filter(p => p && p.review === "approved");
  return publicHeader() + `<main class="page" id="main"><div class="page-head"><div><h1 class="t-page">Recently viewed & search history</h1><p class="muted">Go back to places and searches without remembering their names.</p></div>${rec.length || state.searches.length ? `<button class="btn btn-danger-outline" data-a="clear-history">${icon("trash")}Clear history</button>` : ""}</div>

const WIZ = ["Basic information", "Location", "Rent & facilities", "Photos", "Review & submit"];
function newDraft(p) {
  if (p) return { editId: p.id, title: p.title, type: p.type, rooms: p.rooms, desc: p.desc, area: p.area, landmark: p.landmark, address: p.address || "", pin: p.pin || null, rent: p.rent, water: p.water, electricity: p.electricity, bath: p.bath, security: p.security, selfContained: p.selfContained, avail: p.avail, photos: p.photos.map((src, i) => ({ src, name: `Photo ${i + 1}` })), cover: p.cover || 0, savedAt: null };

}
function validateStep(n, d = state.draft) {
  const e = {};
  if (n === 1) {
    if (d.title.trim().length < 5) e["wz-title"] = d.title.trim() ? "Use at least 5 characters so students can recognise it." : "Please enter a property title.";
    if (!d.type) e["wz-type"] = "Please choose the accommodation type.";
    if (!(+d.rooms >= 1 && +d.rooms <= 10)) e["wz-rooms"] = "Enter a number of rooms from 1 to 10.";
    if (d.desc.trim().length < 30) e["wz-desc"] = `Please write at least 30 characters (now ${d.desc.trim().length}).`;
  }
  if (n === 2) { if (!d.area) e["wz-area"] = "Please choose the neighbourhood."; if (d.landmark.trim().length < 3) e["wz-landmark"] = "Please add a nearby landmark students will recognise."; }
  if (n === 3) { const r = +String(d.rent).replace(/[^\d]/g, ""); if (!r) e["wz-rent"] = "Please enter the monthly rent in RWF."; else if (r < 10000 || r > 1000000) e["wz-rent"] = "Enter an amount between 10,000 and 1,000,000 RWF."; }
  if (n === 4 && !d.photos.length) e["wz-photos"] = "Please add at least one photo. Listings with 3 or more photos get more inquiries.";
  return e;
}
function draftAsProp(d = state.draft) {

VIEWS.overview = () => publicHeader() + `<main class="page doc" id="main">

  <h3 class="t-card" style="margin-top:16px">Pilot scope</h3><ul><li>Accommodation around UR-CST only (8 neighbourhoods within about 5 km).</li><li>Search, filter, save, compare and contact landlords.</li><li>Landlords publish and manage listings. Administrators review them.</li><li>Not included: rent payment, booking confirmation, rental contracts.</li></ul></section>

function moderate(kind, id) {

    reject: { title: `Reject "${p.title}"?`, body: "The listing will not be shown to students. The landlord will see your reason.", confirm: "Reject listing", tone: "danger", ic: "x", field: { label: "Reason for rejection", required: true, placeholder: "e.g. The location is outside the pilot area." } },
  }[kind];
  confirmDialog({ ...cfg, onConfirm: v => {

function onField(e) {
  const el = e.target;
  const f = el.dataset && el.dataset.f;
  const F = state.filters;
  if (!f) {
    if (el.id && el.closest("[data-form]")) {
      if (el.id === "inq-msg") state.form["inq-msg-" + el.closest("[data-form]").dataset.id] = el.value;
      else state.form[el.id] = el.type === "checkbox" ? el.checked : el.value;
    }
    return;
  }
  switch (f) {
    case "q": F.q = el.value; updateResults(); break;
    case "sort": if (e.type === "change") { state.sort = el.value; updateResults(); toast("Results sorted.", { type: "info" }); } break;
    case "range": {
      const k = el.dataset.k, v = +el.value; F[k] = v;
      if (k === "min" && v > F.max) { F.max = v; $("#f-max").value = v; }
      if (k === "max" && v < F.min) { F.min = v; $("#f-min").value = v; }
      el.setAttribute("aria-valuetext", k === "dist" ? `Within ${v} kilometres` : `${fmt(v)} RWF`);
      updateResults(); break;
    }
    case "type": if (e.type === "change") { F.types = el.checked ? [...F.types, el.value] : F.types.filter(t => t !== el.value); updateResults(); } break;
    case "radio": if (e.type === "change") { F[el.dataset.k] = el.value; updateResults(); } break;
    case "flag": if (e.type === "change") { F[el.dataset.k] = el.checked; updateResults(); } break;
    case "form-check": state.form[el.id] = el.checked; break;
    case "saved-sel": if (e.type === "change") { state.savedSelect = el.checked ? [...state.savedSelect, el.value] : state.savedSelect.filter(x => x !== el.value); render(); } break;
    case "draft": {
      const k = el.dataset.k; state.draft[k] = k === "rent" ? el.value.replace(/[^\d]/g, "") : el.value; autosave();
      if (e.type === "change" && (k === "area" || k === "type")) render();
      if (k === "rent" && e.type === "change") render();
      break;
    }
    case "files": if (e.type === "change") {
      const files = [...el.files].filter(x => x.type.startsWith("image/"));
      if (!files.length) { toast("Please choose image files (JPG or PNG).", { type: "error" }); return; }
      let left = files.length;
      files.forEach(file => { const r = new FileReader(); r.onload = () => { state.draft.photos.push({ src: r.result, name: file.name }); if (--left === 0) { delete state.wizErrors["wz-photos"]; autosave(); toast(`${files.length} photo${files.length > 1 ? "s" : ""} added.`); render(); } }; r.readAsDataURL(file); });
    } break;
    case "ll-pref": if (e.type === "change") {
      const ll = state.landlords[state.user.landlordId]; ll[el.dataset.k] = el.checked;
      if (!ll.phoneOn && !ll.whatsapp && !ll.inapp) { ll[el.dataset.k] = true; toast("Keep at least one contact method on so students can reach you.", { type: "error" }); }
      else toast("Contact preferences saved.");
      render();
    } break;
    case "notif-pref": if (e.type === "change") { state.notifPrefs[el.dataset.k] = el.checked; toast("Notification preferences saved."); } break;
    case "user-q": state.userQ = el.value; render(); break;
    case "loc-q": state.locQ = el.value; render(); break;
  }
}

function smartSearch(text) {
  const f = DEFAULT_FILTERS(), t = text.toLowerCase();
  const loc = state.locations.find(l => t.includes(l.name.toLowerCase()));
  if (loc) f.q = loc.name;
  if (/\bsingle\b/.test(t)) f.types.push("single");
  if (/\bshared?\b|\bsharing\b/.test(t) && !/shared (bath|facil|kitchen)/.test(t)) f.types.push("shared");
  if (/studio/.test(t)) f.types.push("studio");
  if (/apartment|flat\b/.test(t)) f.types.push("apartment");
  const m = t.match(/(?:under|below|max(?:imum)?|up to|less than|<)\s*(?:rwf\s*)?([\d][\d,\.]*)\s*(k\b)?(?!\s*km)/);
  if (m) { let n = parseFloat(m[1].replace(/,/g, "")); if (m[2] || n < 1000) n *= 1000; f.max = Math.max(30000, Math.min(250000, Math.round(n / 5000) * 5000)); }
  const d = t.match(/([\d\.]+)\s*km/); if (d) f.dist = Math.min(5, Math.max(0.5, parseFloat(d[1])));
  if (/self[- ]?contained/.test(t)) f.self = "self";
  if (/private bath/.test(t)) f.privateBath = true;
  if (/security|guard/.test(t)) f.security = true;
  if (/water/.test(t)) f.water = true;
  if (/electric/.test(t)) f.electricity = true;
  if (/available/.test(t)) f.availOnly = true;
  const understood = loc || f.types.length || m || d || f.self !== "any" || f.privateBath || f.security || f.water || f.electricity || f.availOnly;
  if (!understood && text.trim()) f.q = text.trim();
  return f;
}

    `<div class="rel">${menuBtn("find", `${icon("search")}Find Housing${icon("chevD")}`, "nl" + (["search", "property", "contact"].includes(name) ? " is-cur" : ""))}${openMenu === "find" ? findMenu() : ""}</div>`,
    `<a href="#saved" class="nl" ${cur("saved")}>${icon("heart")}Saved Properties${pill(savedN)}</a>`,
    `<a href="#compare" class="nl" ${cur("compare")}>${icon("layers")}Compare${pill(cmpN)}</a>`,
    st ? `<a href="#history" class="nl" ${cur("history")}>${icon("clock")}Recently Viewed</a>` : `<a href="#how" class="nl" ${cur("how")}>${icon("info")}How It Works</a>`,
    st ? `<a href="#student" class="nl" ${cur("student")}>${icon("dash")}My Dashboard</a>` : u ? `<a href="#${u.role === "landlord" ? "ll-dashboard" : "admin"}" class="nl">${icon("dash")}My Workspace</a>` : `<div class="rel">${menuBtn("landlords", `${icon("building")}For Landlords${icon("chevD")}`, "nl")}${openMenu === "landlords" ? landlordMenu() : ""}</div>`,
    `<a href="#help" class="nl" ${cur("help")}>${icon("help")}Support</a>`,
  ].join("");
  const dark = prefs.theme === "dark";
  const right = u
    ? `${bell()}<a class="btn btn-secondary hide-m" href="#${st ? "account" : u.role === "landlord" ? "ll-dashboard" : "admin"}">${icon("user")}${esc(u.name)}</a>`
    : `<a class="btn btn-outline hide-m" href="#login">Login</a><a class="btn btn-primary hide-m" href="#register">Sign Up</a>`;
  const mobileLinks = [["home", "Home", "home"], ["search", "Find Housing", "search"], ["saved", `Saved Properties${pill(savedN)}`, "heart"], ["compare", `Compare${pill(cmpN)}`, "layers"], ...(st ? [["history", "Recently Viewed", "clock"], ["student", "My Dashboard", "dash"], ["account", "Account & preferences", "user"]] : [["how", "How It Works", "info"]]), ["help", "Support", "help"]]
    .map(([r, l, ic]) => `<a href="#${r}" ${name === r ? 'aria-current="page"' : ""}>${icon(ic)}${l}</a>`).join("") +
    `<button class="nav-link" data-a="display-open">${icon("text")}Text, font &amp; display</button><button class="nav-link" data-a="theme-toggle">${icon(dark ? "sun" : "moon")}${dark ? "Light mode" : "Dark mode"}</button>` +
    (u ? `${u.role !== "student" ? `<a href="#${u.role === "landlord" ? "ll-dashboard" : "admin"}">${icon("dash")}My workspace</a>` : ""}<button class="nav-link" data-a="logout">${icon("logout")}Log out</button>`
      : `<button class="nav-link" data-a="ll-list">${icon("building")}For Landlords: list a property</button><hr class="divider"><a class="btn btn-secondary btn-block" href="#login">Login</a><a class="btn btn-primary btn-block" href="#register" style="margin-top:8px">Sign Up</a>`);
  return `<a href="#main" class="sr-only">Skip to content</a>
  <header class="header ph"><div class="in">
    <a class="logo" href="#home" aria-label="UR-CST Housing, home"><span class="logo-mark2">${icon("logoHouse")}</span><span>UR-CST Housing<small>Student Accommodation Platform</small></span></a>
    <form class="hsearch" data-form="hsearch" role="search"><div class="input-icon">${icon("search")}<label for="hs-q" class="sr-only">Search accommodation</label><input class="input" id="hs-q" value="${esc(fv("hs-q"))}" placeholder="Search accommodation (e.g., Kiyovu, single room, under 100,000 RWF)" autocomplete="off"></div><button class="btn btn-primary" type="submit">Search</button></form>
    <div class="hctl">
      <button type="button" class="tool-btn" data-a="theme-toggle" aria-pressed="${dark}" title="${dark ? "Switch to light mode" : "Switch to dark mode"}">${icon(dark ? "sun" : "moon")}<span>${dark ? "Light Mode" : "Dark Mode"}</span></button>
      <button type="button" class="tool-btn" data-a="read-page" title="Read this page aloud">${icon("volume")}<span>Listen</span></button>
      <div class="rel hide-m">${menuBtn("text", `<b class="aa">Aa</b> Text${icon("chevD")}`, "drop-btn")}${openMenu === "text" ? textMenu() : ""}</div>
      <div class="rel hide-m">${menuBtn("lang", `${icon("globe")} Language${icon("chevD")}`, "drop-btn")}${openMenu === "lang" ? langMenu() : ""}</div>
      ${right}
      <button class="icon-btn qf-m" data-a="qf-open" aria-label="Quick find">${icon("search")}</button>
      <button class="icon-btn menu-btn" data-a="nav-toggle" aria-expanded="${state.navOpen}" aria-controls="mnav" aria-label="Open menu">${icon("menu")}</button>
    </div></div></header>
  <div class="navrow"><div class="in"><nav class="nav2" aria-label="Main">${nav}</nav>${hereTrail()}</div></div>
  <div class="mobile-nav" id="mnav" ${state.navOpen ? "" : "hidden"} data-a="nav-bg"><div class="sheet" role="dialog" aria-modal="true" aria-label="Menu"><div class="row-between" style="margin-bottom:8px"><span class="logo"><span class="logo-mark2">${icon("logoHouse")}</span><span>UR-CST Housing</span></span><button class="icon-btn" data-a="nav-toggle" aria-label="Close menu">${icon("x")}</button></div>${mobileLinks}</div></div>`;
}

/* ---- Landing page ---- */
function heroField(g, ic, label, valueLabel, placeholder, opts, suffix = () => "") {
  const v = fv(g), picked = opts.find(o => String(o[0]) === String(v)) && v !== "" && v !== "250000";
  return `<div class="rel hf-wrap">${menuBtn(g, `${icon(ic)}<span class="hf-txt"><b>${label}</b><span class="${picked ? "hf-val picked-val" : "hf-val"}">${esc(picked ? valueLabel : placeholder)}</span></span>${icon("chevD")}`, "hfield")}
  ${openMenu === g ? `<div class="hmenu hf-menu" id="menu-${g}" role="dialog" aria-label="${label}"><p class="hmenu-h">Choose ${label.toLowerCase()}</p><div class="chipset" role="radiogroup" aria-label="${label}">${opts.map(([ov, ol, oic]) => { const on = String(ov) === String(v || (g === "hero-budget" ? "250000" : "")); return `<button type="button" class="pchip" id="pk-${g}-${ov || "any"}" role="radio" aria-checked="${on}" data-a="pick" data-g="${g}" data-v="${esc(ov)}" data-close="1">${on ? icon("check") : oic ? icon(oic) : ""}${esc(ol)}${suffix(ov)}</button>`; }).join("")}</div></div>` : ""}</div>`;
}
function landingCard(p) {
  const third = p.bath === "private" ? ["bath", "Private Bathroom"] : p.water && p.electricity ? ["bolt", "Water + Electricity"] : ["bath", "Shared Bathroom"];
  return `<article class="lcard" aria-label="${esc(p.title)}" data-speak="${esc(speakSummary(p))}">
    <div class="lmedia"><a href="#property-${p.id}" tabindex="-1" aria-hidden="true"><img src="${coverImg(p)}" alt="" loading="lazy"></a>${p.avail === "available" ? `<span class="lbadge ok"><span class="ldot"></span>Available</span>` : `<span class="lbadge occ"><span class="ldot"></span>Occupied</span>`}${saveBtn(p, "icon-btn save-btn lheart")}</div>
    <div class="lbody">
      <div class="row-between" style="flex-wrap:nowrap;gap:8px"><a class="ltitle" href="#property-${p.id}">${esc(p.title)}</a><button class="icon-btn listen-btn" data-a="speak-prop" data-id="${p.id}" aria-label="Listen to details of ${esc(p.title)}" title="Listen">${icon("volume")}</button></div>
      <div class="lmeta"><span>${icon("pin")}${esc(p.area)}, Kigali</span><span class="sep" aria-hidden="true"></span><span>${icon("route")}<span class="num">${p.dist} km</span> from UR-CST</span></div>
      <div class="lchips"><span>${icon("bed")}${TYPES[p.type]}</span><span>${icon(p.selfContained ? "home" : "kitchen")}${p.selfContained ? "Self-contained" : "Shared Facilities"}</span><span>${icon(third[0])}${third[1]}</span></div>
      <p class="lprice"><b class="num">RWF ${fmt(p.rent)}</b> / month</p>
      <div class="lacts"><a class="btn btn-outline" href="#property-${p.id}">View Details ${icon("arrowR")}</a><a class="btn btn-primary" href="#contact-${p.id}">${icon("message")}Contact Landlord</a></div>
    </div></article>`;
}
VIEWS.home = () => {
  const featured = ["p1", "p8", "p4"].map(prop).filter(p => p && p.review === "approved");
  const locOpts = [["", "Any location", "map"], ...state.locations.map(l => [l.name, l.name, "pin"])];
  const budOpts = [["250000", "Any budget"], ["50000", "Up to 50,000"], ["75000", "Up to 75,000"], ["100000", "Up to 100,000"], ["150000", "Up to 150,000"]];
  const typeOpts = [["", "Any room type", "home"], ["single", "Single room", "bed"], ["shared", "Shared room", "users"], ["studio", "Studio", "door"], ["apartment", "Apartment", "building"]];
  const b = fv("hero-budget"), t = fv("hero-type");
  return publicHeader() + `<main id="main">
  <section class="hero2" aria-labelledby="hero-h"><div class="hero2-img" aria-hidden="true"><img src="assets/hero.jpg" alt=""></div><div class="in">
    <h1 id="hero-h">Find Your Next Home <em>Near UR-CST</em></h1>
    <p class="lead">Discover affordable student accommodation near campus. Compare rooms, explore facilities, and connect directly with landlords.</p>
    <form class="hero-bar" data-form="hero" aria-label="Search accommodation">
      ${heroField("hero-loc", "pin", "Location", fv("hero-loc"), "e.g., Kiyovu, Muhima…", locOpts)}
      ${heroField("hero-budget", "coins", "Max Budget", b ? `Up to ${fmt(b)} RWF` : "", "Any budget", budOpts, v => v === "250000" ? "" : " RWF")}
      ${heroField("hero-type", "bed", "Room Type", t ? TYPES[t] : "", "Any room type", typeOpts)}
      <button class="btn btn-primary hb-go" type="submit">${icon("search")}Search</button>
    </form>
  </div></section>
  <section class="section feat" aria-labelledby="feat-h"><div class="row-between feat-head"><div><h2 id="feat-h">Featured Accommodation</h2><p>Recently added, student-friendly options near UR-CST in Kigali. Demonstration listings: saving a room does not reserve it.</p></div><a class="view-all" href="#search" data-a="view-all">View All Listings ${icon("arrowR")}</a></div>
  <div class="lgrid">${featured.map(landingCard).join("")}</div></section>
  <section class="section" id="how" aria-labelledby="how-h" style="padding-top:8px;padding-bottom:24px"><div class="howband">
    <div class="how-intro"><h2 id="how-h">How It Works</h2><p>Find your student accommodation in 3 simple steps.</p></div>
    <ol class="how-steps">
      <li><span class="how-ic">${icon("search")}</span><span><b>1. Search Accommodation</b><span>Find rooms near UR-CST by location, budget, and room type.</span></span></li>
      <li class="how-arrow" aria-hidden="true">${icon("arrowR")}</li>
      <li><span class="how-ic">${icon("layers")}</span><span><b>2. Compare Options</b><span>Check prices, distance from campus, facilities, and availability.</span></span></li>
      <li class="how-arrow" aria-hidden="true">${icon("arrowR")}</li>
      <li><span class="how-ic">${icon("message")}</span><span><b>3. Contact Landlord</b><span>Get in touch directly with the landlord and arrange a viewing.</span></span></li>
    </ol></div></section>
  <section class="section trust2" aria-label="Why use UR-CST Housing" style="padding-top:8px">
    <div><span class="t-ic">${icon("shieldcheck")}</span><span><b>Checked Listings</b><span>Every listing is reviewed by an administrator before students see it.</span></span></div>
    <div><span class="t-ic">${icon("pin")}</span><span><b>Near Campus</b><span>Accommodation close to UR-CST in Kigali, with the distance on every listing.</span></span></div>
    <div><span class="t-ic">${icon("coins")}</span><span><b>Affordable Prices</b><span>Clear monthly rent in RWF to fit your budget.</span></span></div>
    <div><span class="t-ic">${icon("bolt")}</span><span><b>Easy Contact</b><span>Call, WhatsApp or message landlords from the platform.</span></span></div>
  </section></main>` + footer();
};
VIEWS.how = VIEWS.home;

/* ---- Actions ---- */
Object.assign(A, {
  menu: el => { const m = el.dataset.m; openMenu = openMenu === m ? null : m; state.bellOpen = false; render(); const first = document.querySelector(`#menu-${m} button:not([disabled]), #menu-${m} a`); if (openMenu && first) setTimeout(() => (document.querySelector(`#menu-${m} [aria-checked="true"]`) || first).focus(), 10); },
  "menu-close": () => { const m = openMenu; openMenu = null; render(); const b = $("#mb-" + m); b && b.focus(); },
  "theme-toggle": () => { setPref("theme", prefs.theme === "dark" ? "light" : "dark"); render(); },
  "find-preset": el => { const [, , over] = FIND_MENU[+el.dataset.i]; state.filters = { ...DEFAULT_FILTERS(), ...JSON.parse(JSON.stringify(over)) }; openMenu = null; recordSearch(); startLoading(400); go("search"); },
  "ll-list": () => { openMenu = null; if (state.user && state.user.role === "landlord") return go("ll-add"); state.regRole = "landlord"; toast("Create a free landlord account to list your property.", { type: "info" }); go("register"); },
  "ll-howto": () => { openMenu = null; go("help"); setTimeout(() => { const s = document.getElementById("sec-Publishingaproperty"); s && s.scrollIntoView({ block: "start" }); }, 80); },
});
const _pick = A.pick;
A.pick = el => { if (el.dataset.close) { state.form[el.dataset.g] = el.dataset.v; const g = el.dataset.g; openMenu = null; render(); const b = $("#mb-" + g); b && b.focus(); return; } return _pick(el); };
S.hsearch = () => { const text = ($("#hs-q") || {}).value || ""; state.filters = smartSearch(text); recordSearch(); const n = filterProps().length; startLoading(400); go("search"); toast(text.trim() ? `Showing ${n} result${n === 1 ? "" : "s"} for "${text.trim()}". Adjust the filters any time.` : `Showing all ${n} places.`, { type: "info" }); };
document.addEventListener("click", e => { if (openMenu && !e.target.closest(".rel")) { openMenu = null; render(); } }, true);
document.addEventListener("keydown", e => { if (e.key === "Escape" && openMenu) { e.stopImmediatePropagation(); A["menu-close"](); } }, true);
/* ============ Boot ============ */
window.addEventListener("hashchange", () => { if (state.route === "how") setTimeout(() => { const h = $("#how"); h && h.scrollIntoView({ behavior: "smooth" }); }, 30); state.errors = {}; });
state.route = location.hash.slice(1) || "home";
render();
</script></body></html>
